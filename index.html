<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BMSG FES 2026 | VENUE NAVIGATOR</title>
<meta name="theme-color" content="#090909">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   BASE
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #050505;
  color: #f5f5f5;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button {
  font: inherit;
}

#app {
  position: fixed;
  inset: 0;
  background: #050505;
}


/* =========================================================
   MAP
========================================================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #0a0a0a;
}

.leaflet-control-zoom {
  display: none;
}

.leaflet-control-attribution {
  background: rgba(8,8,8,.76) !important;
  color: #a8a8a8 !important;
  font-size: 9px !important;
  border-radius: 8px 0 0 0;
}

.leaflet-control-attribution a {
  color: #e1e1e1 !important;
}


/* =========================================================
   DARK SILVER MAP
========================================================= */

.leaflet-tile-pane {
  filter:
    grayscale(1)
    invert(.91)
    contrast(.82)
    brightness(.68);
}


/* =========================================================
   HEADER
========================================================= */

.header {
  position: absolute;

  top: calc(12px + env(safe-area-inset-top));
  left: 14px;
  right: 14px;

  z-index: 1000;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 19px;

  background:
    linear-gradient(
      125deg,
      rgba(215,215,215,.32) 0%,
      rgba(105,105,105,.32) 20%,
      rgba(30,30,30,.94) 48%,
      rgba(80,80,80,.62) 75%,
      rgba(190,190,190,.24) 100%
    );

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow:
    0 14px 45px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 -1px 0 rgba(255,255,255,.12);

  overflow: hidden;
}

/* metallic shine */

.header::before {
  content: "";

  position: absolute;

  top: 0;
  left: 6%;
  right: 6%;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ffffff,
      #a8a8a8,
      #ffffff,
      transparent
    );

  opacity: .95;
}

.header::after {
  content: "";

  position: absolute;

  width: 180px;
  height: 220px;

  top: -120px;
  right: -50px;

  transform: rotate(25deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.11),
      transparent
    );

  pointer-events: none;
}


/* =========================================================
   BRAND
========================================================= */

.brand {
  position: relative;
  z-index: 2;

  padding: 15px 16px 10px;
}

.brand-main {
  font-size: 18px;
  font-weight: 850;

  letter-spacing: .15em;

  color: #fff;

  text-shadow:
    0 1px 0 #000,
    0 0 15px rgba(255,255,255,.12);
}

.brand-sub {
  margin-top: 4px;

  font-size: 9px;
  font-weight: 600;

  letter-spacing: .34em;

  color: #d0d0d0;
}


/* =========================================================
   MODE SWITCH
========================================================= */

.mode-switch {
  position: relative;
  z-index: 2;

  display: flex;

  margin: 0 10px 10px;
  padding: 3px;

  border: 1px solid rgba(255,255,255,.28);
  border-radius: 11px;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.36),
      rgba(255,255,255,.08)
    );

  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.6),
    0 1px 0 rgba(255,255,255,.08);
}

.mode-button {
  flex: 1;

  border: 0;
  border-radius: 8px;

  padding: 9px;

  background: transparent;
  color: #aaa;

  font-size: 10px;
  font-weight: 800;
  letter-spacing: .15em;

  cursor: pointer;

  transition: .2s ease;
}

.mode-button.active {
  color: #080808;

  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      #d8d8d8 22%,
      #8d8d8d 52%,
      #ededed 78%,
      #9d9d9d 100%
    );

  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -1px 0 rgba(0,0,0,.25),
    0 3px 12px rgba(0,0,0,.32);

  text-shadow:
    0 1px 0 rgba(255,255,255,.7);
}


/* =========================================================
   FILTER BAR
========================================================= */

.filters-wrap {
  position: absolute;

  top: calc(134px + env(safe-area-inset-top));

  left: 0;
  right: 0;

  z-index: 900;

  overflow: hidden;
}

.filters {
  display: flex;
  gap: 7px;

  overflow-x: auto;

  padding: 6px 14px 10px;

  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {
  flex: 0 0 auto;

  border: 1px solid rgba(255,255,255,.38);
  border-radius: 999px;

  padding: 8px 14px;

  background:
    linear-gradient(
      145deg,
      rgba(95,95,95,.88),
      rgba(18,18,18,.92)
    );

  color: #d0d0d0;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.23),
    0 5px 15px rgba(0,0,0,.28);

  font-size: 9px;
  font-weight: 800;

  letter-spacing: .1em;

  cursor: pointer;

  transition: .2s ease;
}

.filter.active {
  color: #080808;

  border-color: rgba(255,255,255,.9);

  background:
    linear-gradient(
      135deg,
      #fafafa 0%,
      #bdbdbd 35%,
      #858585 57%,
      #e8e8e8 100%
    );

  box-shadow:
    inset 0 1px 0 #fff,
    0 5px 20px rgba(255,255,255,.13);
}


/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-button {
  position: absolute;

  right: 16px;

  bottom:
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  z-index: 1000;

  width: 58px;
  height: 58px;

  border: 1px solid rgba(255,255,255,.88);
  border-radius: 50%;

  background:
    radial-gradient(
      circle at 30% 22%,
      #ffffff 0%,
      #d5d5d5 15%,
      #858585 38%,
      #3c3c3c 60%,
      #101010 82%
    );

  box-shadow:
    0 12px 30px rgba(0,0,0,.6),
    0 0 0 3px rgba(255,255,255,.09),
    inset 0 2px 2px rgba(255,255,255,.8),
    inset 0 -2px 5px rgba(0,0,0,.7);

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.location-button:active {
  transform: scale(.94);
}


/* LOCATION SYMBOL */

.location-symbol {
  position: relative;

  width: 21px;
  height: 21px;

  border: 2px solid #fff;
  border-radius: 50%;

  filter:
    drop-shadow(0 1px 2px #000);
}

.location-symbol::before {
  content: "";

  position: absolute;

  width: 7px;
  height: 7px;

  top: 5px;
  left: 5px;

  border-radius: 50%;

  background: #fff;

  box-shadow:
    0 0 7px #fff,
    0 0 13px rgba(255,255,255,.75);
}

.location-symbol::after {
  content: "";

  position: absolute;

  width: 2px;
  height: 29px;

  top: -6px;
  left: 7.5px;

  background:
    linear-gradient(
      transparent 0 11%,
      #fff 11% 28%,
      transparent 28% 72%,
      #fff 72% 89%,
      transparent 89%
    );
}


/* =========================================================
   USER LOCATION
========================================================= */

.user-location {
  position: relative;

  width: 22px;
  height: 22px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffffff,
      #d6d6d6 38%,
      #727272 100%
    );

  border: 3px solid #fff;

  box-shadow:
    0 0 0 5px rgba(255,255,255,.18),
    0 0 12px rgba(255,255,255,.9),
    0 0 28px rgba(255,255,255,.65);
}

.user-location::after {
  content: "";

  position: absolute;

  inset: -12px;

  border: 1px solid rgba(255,255,255,.58);
  border-radius: 50%;

  animation:
    locationPulse
    2s
    infinite;
}

@keyframes locationPulse {

  0% {
    transform: scale(.55);
    opacity: 1;
  }

  100% {
    transform: scale(1.55);
    opacity: 0;
  }

}


/* =========================================================
   VENUE MARKERS
========================================================= */

.venue-marker-shell {
  position: relative;

  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #f7f7f7 0%,
      #949494 27%,
      #3b3b3b 50%,
      #cfcfcf 75%,
      #727272 100%
    );

  box-shadow:
    0 8px 22px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,255,255,.65),
    inset 0 1px 1px rgba(255,255,255,.95);
}

.venue-marker {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255,255,255,.45);
  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 25%,
      #626262,
      #171717 62%,
      #050505
    );

  color: #fff;

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.3),
    0 1px 2px rgba(0,0,0,.8);

  font-size: 9px;
  font-weight: 900;

  letter-spacing: -.02em;
}


/* little pointer */

.venue-marker-shell::after {
  content: "";

  position: absolute;

  bottom: -5px;

  width: 8px;
  height: 8px;

  transform: rotate(45deg);

  background: #8f8f8f;

  border-right: 1px solid #d8d8d8;
  border-bottom: 1px solid #d8d8d8;

  z-index: -1;
}


/* =========================================================
   SHEET BACKDROP
========================================================= */

.sheet-backdrop {
  position: fixed;
  inset: 0;

  z-index: 1998;

  background: rgba(0,0,0,.28);

  opacity: 0;

  pointer-events: none;

  transition: opacity .25s ease;
}

.sheet-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}


/* =========================================================
   BOTTOM SHEET
========================================================= */

.bottom-sheet {
  position: fixed;

  left: 10px;
  right: 10px;

  bottom:
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  z-index: 2000;

  border: 1px solid rgba(255,255,255,.55);
  border-radius: 25px;

  padding: 11px 18px 20px;

  background:
    linear-gradient(
      135deg,
      rgba(110,110,110,.94) 0%,
      rgba(35,35,35,.98) 30%,
      rgba(8,8,8,.98) 65%,
      rgba(68,68,68,.97) 100%
    );

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  box-shadow:
    0 -12px 55px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -1px 0 rgba(255,255,255,.1);

  transform:
    translateY(
      calc(100% + 50px)
    );

  transition:
    transform
    .35s
    cubic-bezier(.22,.75,.25,1);

  overflow: hidden;
}


/* metallic top shine */

.bottom-sheet::before {
  content: "";

  position: absolute;

  top: 0;
  left: 5%;
  right: 5%;

  height: 2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #a6a6a6,
      #ffffff,
      #a6a6a6,
      transparent
    );
}

.bottom-sheet::after {
  content: "";

  position: absolute;

  width: 200px;
  height: 300px;

  top: -190px;
  right: -70px;

  transform: rotate(35deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.10),
      transparent
    );

  pointer-events: none;
}

.bottom-sheet.show {
  transform: translateY(0);
}

.sheet-handle {
  position: relative;
  z-index: 2;

  width: 45px;
  height: 4px;

  margin: 0 auto 18px;

  border-radius: 99px;

  background:
    linear-gradient(
      90deg,
      #777,
      #fff,
      #777
    );

  box-shadow:
    0 0 7px rgba(255,255,255,.28);
}

.sheet-number {
  position: relative;
  z-index: 2;

  margin-bottom: 6px;

  color: #c5c5c5;

  font-size: 9px;
  font-weight: 800;

  letter-spacing: .25em;
}

.sheet-title {
  position: relative;
  z-index: 2;

  color: #fff;

  font-size: 25px;
  font-weight: 850;

  letter-spacing: .04em;

  text-shadow:
    0 2px 8px rgba(0,0,0,.5);
}

.sheet-line {
  position: relative;
  z-index: 2;

  height: 1px;

  margin: 15px 0;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #a3a3a3 35%,
      rgba(255,255,255,.05)
    );
}

.sheet-description {
  position: relative;
  z-index: 2;

  color: #d0d0d0;

  font-size: 13px;
  line-height: 1.7;
}

.sheet-close {
  position: relative;
  z-index: 2;

  width: 100%;

  margin-top: 18px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 11px;

  padding: 11px;

  background:
    linear-gradient(
      135deg,
      rgba(210,210,210,.24),
      rgba(55,55,55,.35)
    );

  color: #f0f0f0;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28);

  font-size: 10px;
  font-weight: 800;

  letter-spacing: .18em;

  cursor: pointer;
}


/* =========================================================
   OFFICIAL MAP
========================================================= */

#officialMap {
  position: absolute;
  inset: 0;

  z-index: 500;

  display: none;

  background:
    radial-gradient(
      circle at 50% 40%,
      #2b2b2b,
      #080808 60%
    );

  padding:
    calc(150px + env(safe-area-inset-top))
    14px
    calc(20px + env(safe-area-inset-bottom));
}

#officialMap.show {
  display: flex;
  align-items: center;
  justify-content: center;
}

.official-placeholder {
  position: relative;

  width: 100%;
  max-width: 700px;

  padding: 40px 20px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 21px;

  background:
    linear-gradient(
      135deg,
      #787878,
      #242424 35%,
      #080808 70%,
      #555
    );

  text-align: center;

  box-shadow:
    0 20px 50px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.65);

  overflow: hidden;
}

.official-placeholder::before {
  content: "";

  position: absolute;

  top: 0;
  left: 8%;
  right: 8%;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff,
      transparent
    );
}

.official-placeholder strong {
  display: block;

  margin-bottom: 9px;

  color: #fff;

  font-size: 15px;

  letter-spacing: .15em;
}

.official-placeholder span {
  color: #bbb;

  font-size: 11px;

  line-height: 1.7;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  left: 50%;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  z-index: 3000;

  max-width:
    calc(
      100% - 40px
    );

  padding: 10px 16px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 999px;

  background:
    linear-gradient(
      135deg,
      rgba(105,105,105,.96),
      rgba(15,15,15,.96)
    );

  color: #fff;

  box-shadow:
    0 8px 30px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.28);

  backdrop-filter: blur(15px);

  font-size: 11px;

  transform:
    translateX(-50%)
    translateY(15px);

  opacity: 0;

  pointer-events: none;

  transition: .25s ease;

  white-space: nowrap;
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 800px) {

  .header {
    width: 390px;
    right: auto;
  }

  .filters-wrap {
    width: 700px;
  }

  .bottom-sheet {
    width: 390px;
    left: 20px;
    right: auto;
    bottom: 20px;
  }

}

</style>
</head>

<body>

<div id="app">

  <!-- REAL MAP -->
  <div id="map"></div>


  <!-- OFFICIAL MAP -->
  <div id="officialMap">

    <div class="official-placeholder">

      <strong>
        OFFICIAL VENUE MAP
      </strong>

      <span>
        ここには後から公式会場MAP画像を入れます。<br>
        PCで画像をGitHubに追加したら差し替え可能。
      </span>

    </div>

  </div>


  <!-- HEADER -->
  <header class="header">

    <div class="brand">

      <div class="brand-main">
        BMSG FES 2026
      </div>

      <div class="brand-sub">
        VENUE NAVIGATOR
      </div>

    </div>


    <div class="mode-switch">

      <button
        class="mode-button active"
        data-mode="real"
      >
        REAL MAP
      </button>

      <button
        class="mode-button"
        data-mode="official"
      >
        OFFICIAL MAP
      </button>

    </div>

  </header>


  <!-- FILTER -->
  <div class="filters-wrap">

    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
      >
        ALL
      </button>

      <button
        class="filter"
        data-filter="stage"
      >
        STAGE
      </button>

      <button
        class="filter"
        data-filter="food"
      >
        FOOD
      </button>

      <button
        class="filter"
        data-filter="goods"
      >
        GOODS
      </button>

      <button
        class="filter"
        data-filter="wc"
      >
        WC
      </button>

      <button
        class="filter"
        data-filter="photo"
      >
        PHOTO
      </button>

      <button
        class="filter"
        data-filter="gate"
      >
        GATE
      </button>

      <button
        class="filter"
        data-filter="info"
      >
        INFO
      </button>

    </div>

  </div>


  <!-- LOCATION -->
  <button
    class="location-button"
    id="locationButton"
    aria-label="現在地を表示"
  >
    <span class="location-symbol"></span>
  </button>

</div>


<!-- SHEET BACKDROP -->
<div
  class="sheet-backdrop"
  id="sheetBackdrop"
></div>


<!-- BOTTOM SHEET -->
<div
  class="bottom-sheet"
  id="bottomSheet"
>

  <div class="sheet-handle"></div>

  <div
    class="sheet-number"
    id="sheetNumber"
  ></div>

  <div
    class="sheet-title"
    id="sheetTitle"
  ></div>

  <div class="sheet-line"></div>

  <div
    class="sheet-description"
    id="sheetDescription"
  ></div>

  <button
    class="sheet-close"
    id="sheetClose"
  >
    CLOSE
  </button>

</div>


<!-- TOAST -->
<div
  class="toast"
  id="toast"
></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MAP INITIALIZE
========================================================= */

/*
  仮の中心位置。
  PCで会場MAPと照合後に調整します。
*/

const map = L.map(
  "map",
  {
    zoomControl: false,
    attributionControl: true
  }
).setView(
  [35.6252, 139.7756],
  16
);


/* =========================================================
   MAP TILE
========================================================= */

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* =========================================================
   VENUE DATA
========================================================= */

/*
  ★ 現在はUI確認用の仮座標です ★

  PCで公式MAPとリアル地図を照合後、

  lat = 緯度
  lng = 経度

  を本番位置へ変更します。
*/

const venues = [

  {
    id: 1,

    name: "MAIN STAGE",

    category: "stage",

    icon: "ST",

    lat: 35.6260,
    lng: 139.7748,

    description:
      "MAIN STAGE。正確な位置・詳細情報は後から設定します。"
  },

  {
    id: 2,

    name: "SUB STAGE",

    category: "stage",

    icon: "ST",

    lat: 35.6252,
    lng: 139.7760,

    description:
      "SUB STAGE。正確な位置・詳細情報は後から設定します。"
  },

  {
    id: 3,

    name: "FOOD AREA",

    category: "food",

    icon: "FD",

    lat: 35.6248,
    lng: 139.7749,

    description:
      "キッチンカー・フードエリア。詳細は後から設定します。"
  },

  {
    id: 4,

    name: "GOODS",

    category: "goods",

    icon: "GD",

    lat: 35.6256,
    lng: 139.7767,

    description:
      "グッズ販売エリア。詳細は後から設定します。"
  },

  {
    id: 5,

    name: "RESTROOM",

    category: "wc",

    icon: "WC",

    lat: 35.6244,
    lng: 139.7758,

    description:
      "トイレ。正確な位置は後から設定します。"
  },

  {
    id: 6,

    name: "PHOTO SPOT",

    category: "photo",

    icon: "PH",

    lat: 35.6257,
    lng: 139.7739,

    description:
      "フォトスポット。詳細は後から設定します。"
  },

  {
    id: 7,

    name: "GATE",

    category: "gate",

    icon: "GT",

    lat: 35.6239,
    lng: 139.7748,

    description:
      "入退場ゲート。正確なゲート名と位置は後から設定します。"
  },

  {
    id: 8,

    name: "INFORMATION",

    category: "info",

    icon: "IN",

    lat: 35.6249,
    lng: 139.7739,

    description:
      "インフォメーション。詳細は後から設定します。"
  }

];


/* =========================================================
   VENUE MARKERS
========================================================= */

const venueMarkers = [];


function createVenueIcon(text) {

  return L.divIcon({

    className: "",

    html:
      `
      <div class="venue-marker-shell">
        <div class="venue-marker">
          ${text}
        </div>
      </div>
      `,

    iconSize:
      [44, 49],

    iconAnchor:
      [22, 46]

  });

}


venues.forEach(
  (venue) => {

    const marker =
      L.marker(

        [
          venue.lat,
          venue.lng
        ],

        {
          icon:
            createVenueIcon(
              venue.icon
            )
        }

      ).addTo(map);


    marker.on(
      "click",
      () => {

        openVenue(
          venue
        );

      }
    );


    venueMarkers.push({

      venue,
      marker

    });

  }
);


/* =========================================================
   BOTTOM SHEET
========================================================= */

const bottomSheet =
  document.getElementById(
    "bottomSheet"
  );

const sheetBackdrop =
  document.getElementById(
    "sheetBackdrop"
  );

const sheetNumber =
  document.getElementById(
    "sheetNumber"
  );

const sheetTitle =
  document.getElementById(
    "sheetTitle"
  );

const sheetDescription =
  document.getElementById(
    "sheetDescription"
  );


function openVenue(venue) {

  sheetNumber.textContent =
    String(
      venue.id
    ).padStart(
      2,
      "0"
    )
    +
    " / "
    +
    venue.category.toUpperCase();


  sheetTitle.textContent =
    venue.name;


  sheetDescription.textContent =
    venue.description;


  bottomSheet.classList.add(
    "show"
  );

  sheetBackdrop.classList.add(
    "show"
  );

}


function closeVenue() {

  bottomSheet.classList.remove(
    "show"
  );

  sheetBackdrop.classList.remove(
    "show"
  );

}


document
  .getElementById(
    "sheetClose"
  )
  .addEventListener(
    "click",
    closeVenue
  );


sheetBackdrop.addEventListener(
  "click",
  closeVenue
);


/* =========================================================
   FILTER
========================================================= */

const filterButtons =
  document.querySelectorAll(
    ".filter"
  );


filterButtons.forEach(
  (button) => {

    button.addEventListener(
      "click",
      () => {

        filterButtons.forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        const category =
          button.dataset.filter;


        venueMarkers.forEach(
          ({
            venue,
            marker
          }) => {

            const show =
              category === "all"
              ||
              venue.category === category;


            if (show) {

              if (
                !map.hasLayer(
                  marker
                )
              ) {

                marker.addTo(
                  map
                );

              }

            }

            else {

              if (
                map.hasLayer(
                  marker
                )
              ) {

                map.removeLayer(
                  marker
                );

              }

            }

          }
        );

      }
    );

  }
);


/* =========================================================
   MAP MODE
========================================================= */

const modeButtons =
  document.querySelectorAll(
    ".mode-button"
  );

const officialMap =
  document.getElementById(
    "officialMap"
  );

const filtersWrap =
  document.querySelector(
    ".filters-wrap"
  );

const locationButton =
  document.getElementById(
    "locationButton"
  );


modeButtons.forEach(
  (button) => {

    button.addEventListener(
      "click",
      () => {

        modeButtons.forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        const mode =
          button.dataset.mode;


        if (
          mode === "official"
        ) {

          officialMap.classList.add(
            "show"
          );

          filtersWrap.style.display =
            "none";

          locationButton.style.display =
            "none";

        }

        else {

          officialMap.classList.remove(
            "show"
          );

          filtersWrap.style.display =
            "";

          locationButton.style.display =
            "";


          setTimeout(
            () => {

              map.invalidateSize();

            },
            100
          );

        }

      }
    );

  }
);


/* =========================================================
   CURRENT LOCATION
========================================================= */

/*
  現在地はブラウザ上で表示するためだけに使用。

  ・サーバーへ送信しない
  ・Cloudflareへ送信しない
  ・D1へ保存しない
  ・KVへ保存しない
  ・GitHubへ保存しない
  ・localStorageへ保存しない

  ページを閉じたら追跡終了。
*/

let locationMarker = null;

let accuracyCircle = null;

let watchId = null;

let hasCenteredLocation = false;


const userIcon =
  L.divIcon({

    className: "",

    html:
      `
      <div class="user-location"></div>
      `,

    iconSize:
      [22,22],

    iconAnchor:
      [11,11]

  });


locationButton.addEventListener(
  "click",
  () => {

    /*
      取得済みなら
      現在地へ戻る
    */

    if (
      locationMarker
    ) {

      map.flyTo(

        locationMarker.getLatLng(),

        18,

        {
          duration: .8
        }

      );

      return;

    }


    if (
      !navigator.geolocation
    ) {

      showToast(
        "この端末では現在地を利用できません"
      );

      return;

    }


    showToast(
      "現在地を取得しています…"
    );


    watchId =
      navigator.geolocation.watchPosition(

        locationSuccess,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            3000,

          timeout:
            15000

        }

      );

  }
);


function locationSuccess(
  position
) {

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  /*
    CURRENT LOCATION MARKER
  */

  if (
    !locationMarker
  ) {

    locationMarker =
      L.marker(

        [lat,lng],

        {

          icon:
            userIcon,

          zIndexOffset:
            10000

        }

      ).addTo(map);

  }

  else {

    locationMarker.setLatLng(
      [lat,lng]
    );

  }


  /*
    GPS ACCURACY
  */

  if (
    !accuracyCircle
  ) {

    accuracyCircle =
      L.circle(

        [lat,lng],

        {

          radius:
            accuracy,

          color:
            "#ffffff",

          weight:
            1,

          opacity:
            .35,

          fillColor:
            "#ffffff",

          fillOpacity:
            .07

        }

      ).addTo(map);

  }

  else {

    accuracyCircle.setLatLng(
      [lat,lng]
    );

    accuracyCircle.setRadius(
      accuracy
    );

  }


  /*
    FIRST POSITION
  */

  if (
    !hasCenteredLocation
  ) {

    hasCenteredLocation =
      true;


    map.flyTo(

      [lat,lng],

      18,

      {
        duration:
          1
      }

    );


    showToast(
      "現在地を表示しました"
    );

  }

}


/* =========================================================
   LOCATION ERROR
========================================================= */

function locationError(
  error
) {

  let message =
    "現在地を取得できませんでした";


  if (
    error.code === 1
  ) {

    message =
      "位置情報の利用が許可されていません";

  }

  else if (
    error.code === 2
  ) {

    message =
      "現在地を確認できませんでした";

  }

  else if (
    error.code === 3
  ) {

    message =
      "現在地の取得がタイムアウトしました";

  }


  showToast(
    message
  );

}


/* =========================================================
   TOAST
========================================================= */

const toast =
  document.getElementById(
    "toast"
  );

let toastTimer;


function showToast(
  message
) {

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    if (
      watchId !== null
    ) {

      navigator.geolocation.clearWatch(
        watchId
      );

    }

  }
);

</script>
