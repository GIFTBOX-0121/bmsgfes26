<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>BMSG FES 2026 | VENUE NAVIGATOR</title>
<meta name="theme-color" content="#090909">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  position:fixed;
  inset:0;
}

/* =========================================================
   MAP
========================================================= */

#map{
  position:absolute;
  inset:0;
  z-index:1;
  background:#ddd;
}

.leaflet-control-zoom{
  display:none;
}

.leaflet-control-attribution{
  background:rgba(5,5,5,.72)!important;
  color:#ccc!important;
  font-size:8px!important;
}

.leaflet-control-attribution a{
  color:#fff!important;
}

.leaflet-tile-pane{
  filter:
    saturate(.92)
    brightness(.99)
    contrast(.96);
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top));
  left:12px;
  right:12px;
  z-index:1000;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.58);
  border-radius:20px;

  background:
    linear-gradient(
      125deg,
      rgba(230,230,230,.40),
      rgba(115,115,115,.48) 20%,
      rgba(25,25,25,.95) 48%,
      rgba(88,88,88,.78) 74%,
      rgba(205,205,205,.32)
    );

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  box-shadow:
    0 14px 42px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.82);
}

.header::before{
  content:"";
  position:absolute;
  left:6%;
  right:6%;
  top:0;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff,
      #999,
      #fff,
      transparent
    );
}

.brand{
  padding:14px 15px 9px;
}

.brand-main{
  font-size:18px;
  font-weight:900;
  letter-spacing:.13em;
}

.brand-sub{
  margin-top:3px;
  color:#ddd;
  font-size:8px;
  font-weight:700;
  letter-spacing:.30em;
}


/* =========================================================
   MODE
========================================================= */

.mode-switch{
  display:flex;
  margin:0 9px 9px;
  padding:3px;

  border:1px solid rgba(255,255,255,.25);
  border-radius:11px;

  background:rgba(0,0,0,.25);
}

.mode-button{
  flex:1;
  padding:9px 5px;

  border:0;
  border-radius:8px;

  background:transparent;
  color:#aaa;

  font-size:9px;
  font-weight:900;
  letter-spacing:.12em;
}

.mode-button.active{
  color:#080808;

  background:
    linear-gradient(
      135deg,
      #fff,
      #c7c7c7 32%,
      #888 55%,
      #eee
    );

  box-shadow:
    inset 0 1px 0 #fff,
    0 3px 12px rgba(0,0,0,.35);
}


/* =========================================================
   FILTER
========================================================= */

.filters-wrap{
  position:absolute;
  top:calc(130px + env(safe-area-inset-top));
  left:0;
  right:0;

  z-index:900;
  overflow:hidden;
}

.filters{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding:6px 12px 12px;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;

  padding:8px 13px;

  border:1px solid rgba(255,255,255,.48);
  border-radius:999px;

  background:
    linear-gradient(
      145deg,
      rgba(95,95,95,.94),
      rgba(12,12,12,.95)
    );

  color:#ddd;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    0 5px 14px rgba(0,0,0,.30);

  font-size:9px;
  font-weight:900;

  white-space:nowrap;
}

.filter.active{
  color:#080808;

  background:
    linear-gradient(
      135deg,
      #fff,
      #bdbdbd 38%,
      #858585 60%,
      #eee
    );
}


/* =========================================================
   NORMAL PINS
========================================================= */

.venue-marker{
  width:140px;
  height:72px;

  display:flex;
  flex-direction:column;
  align-items:center;

  pointer-events:auto;
}

.marker-hit{
  position:relative;

  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  touch-action:none;
}

.marker-pin{
  position:relative;

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #fff;
  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #fff,
      #999 25%,
      #333 52%,
      #ddd 78%,
      #666
    );

  box-shadow:
    0 6px 17px rgba(0,0,0,.65),
    0 0 0 2px rgba(0,0,0,.35);
}

.marker-pin::after{
  content:"";

  position:absolute;

  left:50%;
  bottom:-5px;

  width:9px;
  height:9px;

  transform:
    translateX(-50%)
    rotate(45deg);

  background:#aaa;

  border-right:1px solid #fff;
  border-bottom:1px solid #fff;

  z-index:-1;
}

.marker-inner{
  width:31px;
  height:31px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--marker-color);

  border:1px solid rgba(255,255,255,.72);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.4),
    inset 0 -4px 8px rgba(0,0,0,.22),
    0 0 9px var(--marker-glow);
}

.marker-inner svg{
  width:18px;
  height:18px;

  fill:none;
  stroke:#fff;

  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.marker-label{
  margin-top:4px;

  max-width:138px;

  padding:4px 7px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.48);
  border-radius:6px;

  background:rgba(3,3,3,.90);

  color:#fff;

  box-shadow:
    0 3px 9px rgba(0,0,0,.6);

  font-size:8px;
  font-weight:900;

  line-height:1.1;

  text-overflow:ellipsis;
  white-space:nowrap;
}


/* =========================================================
   PIN COLORS
========================================================= */

.marker-gate{
  --marker-color:#00a875;
  --marker-glow:rgba(0,168,117,.8);
}

.marker-west{
  --marker-color:#d99b00;
  --marker-glow:rgba(217,155,0,.85);
}

.marker-east{
  --marker-color:#8d56ff;
  --marker-glow:rgba(141,86,255,.85);
}

.marker-food{
  --marker-color:#ff781e;
  --marker-glow:rgba(255,120,30,.85);
}

.marker-goods{
  --marker-color:#00aeea;
  --marker-glow:rgba(0,174,234,.85);
}

.marker-penlight{
  --marker-color:#9d5cff;
  --marker-glow:rgba(157,92,255,.9);
}

.marker-wc{
  --marker-color:#1769ff;
  --marker-glow:rgba(23,105,255,.8);
}

.marker-upgrade{
  --marker-color:#ff3b88;
  --marker-glow:rgba(255,59,136,.9);
}

.marker-photo{
  --marker-color:#e64eb5;
  --marker-glow:rgba(230,78,181,.8);
}

.marker-info{
  --marker-color:#d5a600;
  --marker-glow:rgba(213,166,0,.8);
}

.marker-booth{
  --marker-color:#00a99d;
  --marker-glow:rgba(0,169,157,.8);
}

.marker-other{
  --marker-color:#707984;
  --marker-glow:rgba(180,190,200,.7);
}

.marker-smoking{
  --marker-color:#4d535a;
  --marker-glow:rgba(200,210,220,.7);
}


/* =========================================================
   STAGE

   ★重要
   CSS transformで位置をずらさない。
   LeafletのiconAnchorでプレート中央を
   正確に指定座標へ合わせる。
========================================================= */

.stage-fixed{
  width:164px;
  height:60px;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

.stage-plate{
  position:relative;

  width:164px;

  padding:10px 15px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.92);
  border-radius:11px;

  background:
    linear-gradient(
      120deg,
      #eeeeee 0%,
      #858585 12%,
      #151515 28%,
      #050505 65%,
      #686868 88%,
      #d5d5d5 100%
    );

  box-shadow:
    0 7px 20px rgba(0,0,0,.7),
    0 0 16px rgba(118,78,255,.55),
    inset 0 1px 0 rgba(255,255,255,.75);
}

.stage-plate::before{
  content:"";

  position:absolute;

  top:0;
  left:10px;
  right:10px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff,
      transparent
    );
}

.stage-dot{
  display:inline-block;

  width:7px;
  height:7px;

  margin-right:7px;

  border-radius:50%;

  background:#8c61ff;

  box-shadow:
    0 0 9px #8c61ff;
}

.stage-name{
  color:#fff;

  font-size:11px;
  font-weight:950;

  letter-spacing:.08em;

  white-space:nowrap;
}

.stage-sub{
  margin-top:3px;

  color:#bcbcbc;

  font-size:7px;
  font-weight:800;

  letter-spacing:.15em;
}


/* =========================================================
   EDITABLE
========================================================= */

body.editing .editable-marker .marker-pin{
  box-shadow:
    0 0 0 3px rgba(255,255,255,.70),
    0 0 24px rgba(255,255,255,.9),
    0 6px 17px rgba(0,0,0,.65);
}

body.editing .editable-marker .marker-label::after{
  content:" ✥";
}

.venue-marker.selected .marker-pin{
  box-shadow:
    0 0 0 4px #fff,
    0 0 0 8px rgba(255,255,255,.20),
    0 0 30px #fff;
}

.venue-marker.selected .marker-label{
  color:#050505;
  background:#fff;
}


/* =========================================================
   USER LOCATION
========================================================= */

.user-location{
  position:relative;

  width:22px;
  height:22px;

  border:3px solid #fff;
  border-radius:50%;

  background:#1976ff;

  box-shadow:
    0 0 0 5px rgba(25,118,255,.18),
    0 0 14px rgba(25,118,255,.95),
    0 0 30px rgba(25,118,255,.55);
}

.user-location::after{
  content:"";

  position:absolute;
  inset:-12px;

  border:1px solid rgba(25,118,255,.65);
  border-radius:50%;

  animation:pulse 2s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(.55);
    opacity:1;
  }

  100%{
    transform:scale(1.5);
    opacity:0;
  }

}


/* =========================================================
   BUTTONS
========================================================= */

.location-button{
  position:absolute;

  right:15px;

  bottom:
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  z-index:1000;

  width:56px;
  height:56px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.9);
  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 22%,
      #fff,
      #d3d3d3 16%,
      #858585 38%,
      #363636 62%,
      #0b0b0b 84%
    );

  box-shadow:
    0 10px 28px rgba(0,0,0,.55),
    inset 0 2px 2px rgba(255,255,255,.8);
}

.location-symbol{
  position:relative;

  width:21px;
  height:21px;

  border:2px solid #fff;
  border-radius:50%;
}

.location-symbol::before{
  content:"";

  position:absolute;

  top:5px;
  left:5px;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#fff;
}


.overlay-button{
  position:absolute;

  top:calc(190px + env(safe-area-inset-top));
  right:12px;

  z-index:950;

  padding:9px 12px;

  border:1px solid rgba(255,255,255,.62);
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      rgba(150,150,150,.94),
      rgba(15,15,15,.97)
    );

  color:#fff;

  box-shadow:
    0 7px 20px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.55);

  font-size:9px;
  font-weight:900;
  letter-spacing:.10em;
}

.overlay-button.active{
  color:#050505;

  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa
    );
}


/* =========================================================
   OVERLAY
========================================================= */

.free-overlay{
  position:absolute;

  z-index:600;

  display:none;

  left:50%;
  top:52%;

  width:min(86vw,720px);

  transform:translate(-50%,-50%);

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;

  cursor:move;
}

.free-overlay.show{
  display:block;
}

.free-overlay img{
  display:block;

  width:100%;
  height:auto;

  pointer-events:none;

  border:1px solid rgba(255,255,255,.75);
  border-radius:12px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.55);
}

.overlay-panel{
  position:absolute;

  top:calc(232px + env(safe-area-inset-top));
  right:12px;

  z-index:960;

  display:none;

  width:185px;

  padding:10px;

  border:1px solid rgba(255,255,255,.5);
  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      rgba(115,115,115,.95),
      rgba(10,10,10,.96)
    );

  backdrop-filter:blur(15px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.45);
}

.overlay-panel.show{
  display:block;
}

.overlay-title{
  font-size:8px;
  font-weight:900;
  letter-spacing:.12em;
}

.overlay-opacity{
  width:100%;
  margin-top:8px;
}

.overlay-hint{
  margin-top:4px;

  color:#aaa;

  font-size:7px;
  line-height:1.4;
}


/* =========================================================
   OFFICIAL MAP
========================================================= */

#officialMap{
  position:absolute;
  inset:0;

  z-index:500;

  display:none;

  padding:
    calc(138px + env(safe-area-inset-top))
    6px
    calc(8px + env(safe-area-inset-bottom));

  background:
    radial-gradient(
      circle at 50% 40%,
      #333,
      #050505 70%
    );
}

#officialMap.show{
  display:block;
}

.official-scroll{
  width:100%;
  height:100%;

  overflow:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  -webkit-overflow-scrolling:touch;
}

.official-scroll img{
  display:block;

  width:100%;
  height:auto;

  max-width:1100px;

  border:1px solid rgba(255,255,255,.55);
  border-radius:14px;

  box-shadow:
    0 16px 50px rgba(0,0,0,.7);
}


/* =========================================================
   EDIT
========================================================= */

.edit-button{
  position:absolute;

  left:14px;

  bottom:
    calc(
      28px +
      env(safe-area-inset-bottom)
    );

  z-index:1200;

  padding:11px 15px;

  border:1px solid rgba(255,255,255,.7);
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #777,
      #111
    );

  color:#fff;

  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
}

.edit-button.active{
  color:#050505;

  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa
    );
}

.edit-panel{
  position:absolute;

  left:12px;
  right:12px;

  bottom:
    calc(
      82px +
      env(safe-area-inset-bottom)
    );

  z-index:1300;

  display:none;

  padding:14px;

  border:1px solid rgba(255,255,255,.6);
  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(125,125,125,.97),
      rgba(25,25,25,.98) 40%,
      rgba(5,5,5,.98)
    );

  backdrop-filter:blur(20px);
}

.edit-panel.show{
  display:block;
}

.edit-title{
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
}

.edit-text{
  margin-top:7px;
  color:#ccc;
  font-size:10px;
  line-height:1.55;
}

.edit-selected{
  margin-top:10px;

  padding:9px 10px;

  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;

  background:rgba(0,0,0,.3);

  font-size:10px;
  line-height:1.5;
}

.copy-button{
  width:100%;

  margin-top:10px;
  padding:11px;

  border:1px solid #fff;
  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa
    );

  color:#080808;

  font-size:10px;
  font-weight:900;
}


/* =========================================================
   SHEET
========================================================= */

.sheet-backdrop{
  position:fixed;
  inset:0;

  z-index:1998;

  background:rgba(0,0,0,.25);

  opacity:0;

  pointer-events:none;

  transition:.2s;
}

.sheet-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.bottom-sheet{
  position:fixed;

  left:10px;
  right:10px;

  bottom:
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  z-index:2000;

  padding:11px 18px 19px;

  border:1px solid rgba(255,255,255,.58);
  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      rgba(120,120,120,.97),
      rgba(32,32,32,.98) 32%,
      rgba(6,6,6,.99) 67%,
      rgba(70,70,70,.98)
    );

  backdrop-filter:blur(24px);

  box-shadow:
    0 -12px 55px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.7);

  transform:
    translateY(
      calc(100% + 80px)
    );

  transition:
    transform .34s cubic-bezier(.22,.75,.25,1);
}

.bottom-sheet.show{
  transform:translateY(0);
}

.sheet-handle{
  width:43px;
  height:4px;

  margin:0 auto 17px;

  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      #777,
      #fff,
      #777
    );
}

.sheet-category{
  margin-bottom:5px;

  color:#bbb;

  font-size:9px;
  font-weight:900;
  letter-spacing:.18em;
}

.sheet-title{
  font-size:22px;
  font-weight:900;
}

.sheet-line{
  height:1px;

  margin:14px 0;

  background:
    linear-gradient(
      90deg,
      #fff,
      #999 35%,
      transparent
    );
}

.sheet-description{
  color:#ddd;
  font-size:13px;
  line-height:1.65;
}

.sheet-arrow-wrap{
  display:none;
  margin:10px 0 5px;
  text-align:center;
}

.sheet-arrow-wrap.show{
  display:block;
}

.sheet-arrow{
  display:inline-flex;

  width:76px;
  height:76px;

  align-items:center;
  justify-content:center;

  color:#fff;

  font-size:58px;

  text-shadow:
    0 0 12px rgba(255,255,255,.8);
}

.sheet-arrow-note{
  margin-top:2px;

  color:#aaa;

  font-size:9px;
  font-weight:800;
  letter-spacing:.10em;
}

.sheet-close{
  width:100%;

  margin-top:16px;
  padding:11px;

  border:1px solid rgba(255,255,255,.45);
  border-radius:10px;

  background:rgba(255,255,255,.10);

  color:#fff;

  font-size:10px;
  font-weight:900;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  z-index:3000;

  padding:10px 15px;

  border:1px solid rgba(255,255,255,.48);
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #777,
      #111
    );

  color:#fff;

  font-size:10px;

  white-space:nowrap;

  opacity:0;

  transform:translate(-50%,15px);

  pointer-events:none;

  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div id="app">

<div id="map"></div>


<div class="free-overlay" id="freeOverlay">
  <img src="./Map.JPG" id="overlayImage" alt="">
</div>


<div id="officialMap">

  <div class="official-scroll">

    <img
      src="./Map.JPG"
      alt="BMSG FES 2026 会場マップ"
    >

  </div>

</div>


<header class="header">

  <div class="brand">

    <div class="brand-main">
      BMSG FES 2026
    </div>

    <div class="brand-sub">
      VENUE NAVIGATOR
    </div>

  </div>


  <div class="mode-switch">

    <button
      class="mode-button active"
      data-mode="real"
    >
      REAL MAP
    </button>

    <button
      class="mode-button"
      data-mode="official"
    >
      OFFICIAL MAP
    </button>

  </div>

</header>

/* =========================================================
   CREATE ICON
========================================================= */

function createVenueIcon(v){

  const iconType =
    v.iconType ||
    v.category;

  const svg =
    icons[iconType] ||
    icons.other;


  return L.divIcon({

    className:"venue-leaflet-icon",

    html:`
      <div
        class="
          venue-marker
          marker-${v.style}
          ${v.editable ? "editable-marker" : ""}
        "
      >

        <div class="marker-hit">

          <div class="marker-pin">

            <div class="marker-inner">
              ${svg}
            </div>

          </div>

        </div>

        <div class="marker-label">
          ${v.label}
        </div>

      </div>
    `,

    iconSize:[
      140,
      72
    ],

    iconAnchor:[
      70,
      46
    ]

  });

}


/* =========================================================
   MARKERS
========================================================= */

const venueMarkers = [];

let editMode = false;

let selectedItem = null;


venues.forEach(v => {

  const marker =
    L.marker(

      [
        v.lat,
        v.lng
      ],

      {

        icon:createVenueIcon(v),

        draggable:false,

        autoPan:true,

        riseOnHover:true

      }

    ).addTo(map);


  const item = {
    venue:v,
    marker:marker
  };


  venueMarkers.push(item);


  marker.on(
    "click",
    event => {

      L.DomEvent.stopPropagation(event);


      if(editMode){

        if(v.editable){

          selectMarker(item);

        }

        else{

          showToast(
            "このピンは位置確定済みです"
          );

        }

        return;

      }


      openVenue(v);

    }
  );


  marker.on(
    "drag",
    () => {

      if(
        editMode &&
        v.editable
      ){

        updateVenuePosition(item);

      }

    }
  );


  marker.on(
    "dragend",
    () => {

      if(
        editMode &&
        v.editable
      ){

        updateVenuePosition(item);

        showToast(
          `${v.name} を移動しました`
        );

      }

    }
  );

});


/* =========================================================
   EDIT
========================================================= */

const editButton =
  document.getElementById("editButton");

const editPanel =
  document.getElementById("editPanel");


function selectMarker(item){

  selectedItem = item;


  document
    .querySelectorAll(".venue-marker")
    .forEach(el => {

      el.classList.remove("selected");

    });


  const element =
    item.marker.getElement();


  if(element){

    const visual =
      element.querySelector(".venue-marker");


    if(visual){

      visual.classList.add("selected");

    }

  }


  updateVenuePosition(item);

}


function updateVenuePosition(item){

  const p =
    item.marker.getLatLng();


  item.venue.lat = p.lat;
  item.venue.lng = p.lng;


  document.getElementById(
    "editSelected"
  ).innerHTML = `

    <strong>
      ${item.venue.name}
    </strong>

    <br>

    LAT：${p.lat.toFixed(7)}

    <br>

    LNG：${p.lng.toFixed(7)}

  `;

}


editButton.addEventListener(
  "click",
  () => {

    editMode = !editMode;


    document.body.classList.toggle(
      "editing",
      editMode
    );


    editButton.classList.toggle(
      "active",
      editMode
    );


    editPanel.classList.toggle(
      "show",
      editMode
    );


    editButton.textContent =
      editMode
      ? "EDITING NEW PINS"
      : "EDIT NEW PINS";


    venueMarkers.forEach(item => {

      if(
        editMode &&
        item.venue.editable
      ){

        item.marker.dragging.enable();

      }

      else{

        item.marker.dragging.disable();

      }

    });


    if(!editMode){

      selectedItem = null;

      document
        .querySelectorAll(".venue-marker")
        .forEach(el => {

          el.classList.remove("selected");

        });

    }

  }
);


map.on(
  "click",
  event => {

    if(
      !editMode ||
      !selectedItem
    ){
      return;
    }


    selectedItem.marker.setLatLng(
      event.latlng
    );


    updateVenuePosition(
      selectedItem
    );

  }
);


/* =========================================================
   COPY NEW PINS
========================================================= */

document
.getElementById("copyButton")
.addEventListener(
  "click",
  async () => {

    const output =
      venueMarkers

      .filter(
        item =>
          item.venue.editable
      )

      .map(
        item => {

          const p =
            item.marker.getLatLng();

          return {

            id:item.venue.id,

            name:item.venue.name,

            lat:Number(
              p.lat.toFixed(7)
            ),

            lng:Number(
              p.lng.toFixed(7)
            )

          };

        }
      );


    const text =
      JSON.stringify(
        output,
        null,
        2
      );


    try{

      await navigator.clipboard.writeText(
        text
      );

      showToast(
        "追加4地点をコピーしました"
      );

    }

    catch(e){

      window.prompt(
        "コピーしてください",
        text
      );

    }

  }
);


/* =========================================================
   FILTER
========================================================= */

document
.querySelectorAll(".filter")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      document
      .querySelectorAll(".filter")
      .forEach(b =>
        b.classList.remove("active")
      );


      button.classList.add("active");


      const category =
        button.dataset.filter;


      venueMarkers.forEach(item => {

        const visible =
          category === "all"
          ||
          item.venue.category === category;


        if(visible){

          if(!map.hasLayer(item.marker)){

            item.marker.addTo(map);

          }

        }

        else{

          if(map.hasLayer(item.marker)){

            map.removeLayer(item.marker);

          }

        }

      });


      /*
        ★ STAGEは絶対消さない
      */

      stageMarkers.forEach(marker => {

        if(!map.hasLayer(marker)){

          marker.addTo(map);

        }

      });

    }
  );

});


/* =========================================================
   DETAIL
========================================================= */

const bottomSheet =
  document.getElementById("bottomSheet");

const sheetBackdrop =
  document.getElementById("sheetBackdrop");

const sheetCategory =
  document.getElementById("sheetCategory");

const sheetTitle =
  document.getElementById("sheetTitle");

const sheetDescription =
  document.getElementById("sheetDescription");

const sheetArrowWrap =
  document.getElementById("sheetArrowWrap");

const sheetArrow =
  document.getElementById("sheetArrow");


function openVenue(v){

  sheetCategory.textContent =
    v.category.toUpperCase();


  sheetTitle.textContent =
    v.name;


  sheetDescription.textContent =
    v.description;


  if(
    typeof v.arrow === "number"
  ){

    sheetArrowWrap.classList.add("show");

    sheetArrow.style.transform =
      `rotate(${v.arrow}deg)`;

  }

  else{

    sheetArrowWrap.classList.remove("show");

  }


  bottomSheet.classList.add("show");

  sheetBackdrop.classList.add("show");

}


function closeVenue(){

  bottomSheet.classList.remove("show");

  sheetBackdrop.classList.remove("show");

}


document
.getElementById("sheetClose")

/* =========================================================
   REAL / OFFICIAL
========================================================= */

const officialMap =
  document.getElementById("officialMap");

const filtersWrap =
  document.querySelector(".filters-wrap");

const locationButton =
  document.getElementById("locationButton");

const overlayButton =
  document.getElementById("overlayButton");

const overlayPanel =
  document.getElementById("overlayPanel");


document
.querySelectorAll(".mode-button")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      document
      .querySelectorAll(".mode-button")
      .forEach(b =>
        b.classList.remove("active")
      );


      button.classList.add("active");


      if(
        button.dataset.mode === "official"
      ){

        officialMap.classList.add("show");

        filtersWrap.style.display = "none";

        locationButton.style.display = "none";

        editButton.style.display = "none";

        editPanel.classList.remove("show");

        overlayButton.style.display = "none";

        overlayPanel.classList.remove("show");

      }

      else{

        officialMap.classList.remove("show");

        filtersWrap.style.display = "";

        locationButton.style.display = "";

        editButton.style.display = "";

        overlayButton.style.display = "";

        if(editMode){

          editPanel.classList.add("show");

        }


        setTimeout(
          () => map.invalidateSize(),
          100
        );

      }

    }
  );

});


/* =========================================================
   OVERLAY
========================================================= */

const freeOverlay =
  document.getElementById("freeOverlay");

const overlayImage =
  document.getElementById("overlayImage");

const overlayOpacity =
  document.getElementById("overlayOpacity");


let overlayVisible = false;


overlayButton.addEventListener(
  "click",
  () => {

    overlayVisible =
      !overlayVisible;


    freeOverlay.classList.toggle(
      "show",
      overlayVisible
    );


    overlayPanel.classList.toggle(
      "show",
      overlayVisible
    );


    overlayButton.classList.toggle(
      "active",
      overlayVisible
    );


    overlayButton.textContent =
      overlayVisible
      ? "OVERLAY ON"
      : "OVERLAY";

  }
);


overlayOpacity.addEventListener(
  "input",
  () => {

    overlayImage.style.opacity =
      Number(
        overlayOpacity.value
      ) / 100;

  }
);


overlayImage.style.opacity =
  Number(
    overlayOpacity.value
  ) / 100;


/* =========================================================
   OVERLAY DRAG
========================================================= */

let overlayDragging = false;

let overlayStartX = 0;
let overlayStartY = 0;

let overlayLeft = 50;
let overlayTop = 52;


freeOverlay.addEventListener(
  "pointerdown",
  event => {

    overlayDragging = true;

    overlayStartX =
      event.clientX;

    overlayStartY =
      event.clientY;

    freeOverlay.setPointerCapture(
      event.pointerId
    );

  }
);


freeOverlay.addEventListener(
  "pointermove",
  event => {

    if(!overlayDragging){
      return;
    }


    const dx =
      event.clientX -
      overlayStartX;


    const dy =
      event.clientY -
      overlayStartY;


    overlayLeft +=
      dx /
      window.innerWidth *
      100;


    overlayTop +=
      dy /
      window.innerHeight *
      100;


    freeOverlay.style.left =
      overlayLeft + "%";


    freeOverlay.style.top =
      overlayTop + "%";


    overlayStartX =
      event.clientX;


    overlayStartY =
      event.clientY;

  }
);


freeOverlay.addEventListener(
  "pointerup",
  () => {

    overlayDragging = false;

  }
);


/* =========================================================
   GPS
========================================================= */

let locationMarker = null;
let accuracyCircle = null;
let watchId = null;
let firstLocation = true;


const userIcon =
  L.divIcon({

    className:"",

    html:
      '<div class="user-location"></div>',

    iconSize:[22,22],

    iconAnchor:[11,11]

  });


locationButton.addEventListener(
  "click",
  () => {

    if(locationMarker){

      map.flyTo(
        locationMarker.getLatLng(),
        18
      );

      return;

    }


    if(!navigator.geolocation){

      showToast(
        "位置情報を利用できません"
      );

      return;

    }


    showToast(
      "現在地を取得しています…"
    );


    watchId =
      navigator.geolocation.watchPosition(

        locationSuccess,

        locationError,

        {
          enableHighAccuracy:true,
          maximumAge:2000,
          timeout:15000
        }

      );

  }
);


function locationSuccess(position){

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  if(!locationMarker){

    locationMarker =
      L.marker(
        [lat,lng],
        {
          icon:userIcon,
          zIndexOffset:10000
        }
      ).addTo(map);

  }

  else{

    locationMarker.setLatLng(
      [lat,lng]
    );

  }


  if(!accuracyCircle){

    accuracyCircle =
      L.circle(
        [lat,lng],
        {
          radius:accuracy,
          color:"#1976ff",
          weight:1,
          opacity:.5,
          fillColor:"#1976ff",
          fillOpacity:.08
        }
      ).addTo(map);

  }

  else{

    accuracyCircle.setLatLng(
      [lat,lng]
    );

    accuracyCircle.setRadius(
      accuracy
    );

  }


  if(firstLocation){

    firstLocation = false;

    map.flyTo(
      [lat,lng],
      18
    );

    showToast(
      "現在地を表示しました"
    );

  }

}


function locationError(){

  showToast(
    "現在地を取得できませんでした"
  );

}


/* =========================================================
   TOAST
========================================================= */

const toast =
  document.getElementById("toast");

let toastTimer;


function showToast(message){

  clearTimeout(toastTimer);

  toast.textContent =
    message;

  toast.classList.add("show");


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove("show");

      },
      2300
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    if(watchId !== null){

      navigator.geolocation.clearWatch(
        watchId
      );

    }

  }
);

</script>
