<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>BMSG FES 2026 | VENUE NAVIGATOR</title>
<meta name="theme-color" content="#090909">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   BASE
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #050505;
  color: #fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}


/* =========================================================
   MAP
========================================================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #ddd;
}

.leaflet-control-zoom {
  display: none;
}

.leaflet-control-attribution {
  background: rgba(5,5,5,.72) !important;
  color: #ccc !important;
  font-size: 8px !important;
}

.leaflet-control-attribution a {
  color: #fff !important;
}


/*
  色を残す。
  完全モノクロにはしない。
*/

.leaflet-tile-pane {
  filter:
    saturate(.82)
    brightness(.96)
    contrast(.95);
}


/* =========================================================
   HEADER
========================================================= */

.header {
  position: absolute;

  top: calc(10px + env(safe-area-inset-top));
  left: 12px;
  right: 12px;

  z-index: 1000;

  overflow: hidden;

  border: 1px solid rgba(255,255,255,.58);
  border-radius: 20px;

  background:
    linear-gradient(
      125deg,
      rgba(230,230,230,.40),
      rgba(115,115,115,.48) 20%,
      rgba(25,25,25,.95) 48%,
      rgba(88,88,88,.78) 74%,
      rgba(205,205,205,.32)
    );

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow:
    0 14px 42px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.82);
}

.header::before {
  content: "";

  position: absolute;
  left: 6%;
  right: 6%;
  top: 0;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff,
      #999,
      #fff,
      transparent
    );
}


/* =========================================================
   BRAND
========================================================= */

.brand {
  padding: 14px 15px 9px;
}

.brand-main {
  font-size: 18px;
  font-weight: 900;

  letter-spacing: .13em;
}

.brand-sub {
  margin-top: 3px;

  color: #ddd;

  font-size: 8px;
  font-weight: 700;

  letter-spacing: .30em;
}


/* =========================================================
   MODE
========================================================= */

.mode-switch {
  display: flex;

  margin: 0 9px 9px;
  padding: 3px;

  border: 1px solid rgba(255,255,255,.25);
  border-radius: 11px;

  background: rgba(0,0,0,.25);
}

.mode-button {
  flex: 1;

  padding: 9px 5px;

  border: 0;
  border-radius: 8px;

  background: transparent;

  color: #aaa;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: .12em;
}

.mode-button.active {
  color: #080808;

  background:
    linear-gradient(
      135deg,
      #fff,
      #c7c7c7 32%,
      #888 55%,
      #eee
    );

  box-shadow:
    inset 0 1px 0 #fff,
    0 3px 12px rgba(0,0,0,.35);
}


/* =========================================================
   FILTERS
========================================================= */

.filters-wrap {
  position: absolute;

  top: calc(130px + env(safe-area-inset-top));
  left: 0;
  right: 0;

  z-index: 900;

  overflow: hidden;
}

.filters {
  display: flex;
  gap: 7px;

  overflow-x: auto;

  padding: 6px 12px 12px;

  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {
  flex: 0 0 auto;

  padding: 8px 13px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 999px;

  background:
    linear-gradient(
      145deg,
      rgba(95,95,95,.94),
      rgba(12,12,12,.95)
    );

  color: #ddd;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    0 5px 14px rgba(0,0,0,.30);

  backdrop-filter: blur(12px);

  font-size: 9px;
  font-weight: 900;

  white-space: nowrap;
}

.filter.active {
  color: #080808;

  background:
    linear-gradient(
      135deg,
      #fff,
      #bdbdbd 38%,
      #858585 60%,
      #eee
    );
}


/* =========================================================
   MARKER
========================================================= */

.venue-marker {
  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;

  width: max-content;

  transform: translateX(-50%);
}

.marker-pin {
  position: relative;

  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 2px solid #fff;
  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #fff,
      #999 25%,
      #333 52%,
      #ddd 78%,
      #666
    );

  box-shadow:
    0 6px 17px rgba(0,0,0,.65),
    0 0 0 2px rgba(0,0,0,.35);
}

.marker-pin::after {
  content: "";

  position: absolute;

  bottom: -5px;

  width: 9px;
  height: 9px;

  transform: rotate(45deg);

  background: #aaa;

  border-right: 1px solid #fff;
  border-bottom: 1px solid #fff;

  z-index: -1;
}

.marker-inner {
  width: 31px;
  height: 31px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: var(--marker-color);

  border: 1px solid rgba(255,255,255,.7);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.4),
    inset 0 -4px 8px rgba(0,0,0,.22),
    0 0 9px var(--marker-glow);
}

.marker-inner svg {
  width: 18px;
  height: 18px;

  fill: none;
  stroke: #fff;

  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.marker-label {
  margin-top: 7px;

  max-width: 145px;

  padding: 4px 7px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 6px;

  background: rgba(3,3,3,.88);

  color: #fff;

  box-shadow:
    0 3px 9px rgba(0,0,0,.6);

  font-size: 8px;
  font-weight: 900;

  line-height: 1.1;

  white-space: nowrap;
}


/* =========================================================
   CATEGORY COLORS
========================================================= */

.marker-stage {
  --marker-color: #704cff;
  --marker-glow: rgba(112,76,255,.8);
}

.marker-gate {
  --marker-color: #00a875;
  --marker-glow: rgba(0,168,117,.8);
}

.marker-food {
  --marker-color: #ff781e;
  --marker-glow: rgba(255,120,30,.8);
}

.marker-goods {
  --marker-color: #00aeea;
  --marker-glow: rgba(0,174,234,.8);
}

.marker-wc {
  --marker-color: #1769ff;
  --marker-glow: rgba(23,105,255,.8);
}

.marker-photo {
  --marker-color: #e64eb5;
  --marker-glow: rgba(230,78,181,.8);
}

.marker-info {
  --marker-color: #d5a600;
  --marker-glow: rgba(213,166,0,.8);
}

.marker-bar {
  --marker-color: #e33e46;
  --marker-glow: rgba(227,62,70,.8);
}

.marker-booth {
  --marker-color: #00a99d;
  --marker-glow: rgba(0,169,157,.8);
}

.marker-rest {
  --marker-color: #76808b;
  --marker-glow: rgba(180,190,200,.65);
}


/* STAGE BIG */

.stage-marker .marker-pin {
  width: 52px;
  height: 52px;
}

.stage-marker .marker-inner {
  width: 41px;
  height: 41px;
}

.stage-marker .marker-inner svg {
  width: 23px;
  height: 23px;
}

.stage-marker .marker-label {
  padding: 5px 9px;

  font-size: 10px;
}


/* =========================================================
   USER LOCATION
========================================================= */

.user-location {
  position: relative;

  width: 22px;
  height: 22px;

  border: 3px solid #fff;
  border-radius: 50%;

  background: #1976ff;

  box-shadow:
    0 0 0 5px rgba(25,118,255,.18),
    0 0 14px rgba(25,118,255,.95),
    0 0 30px rgba(25,118,255,.55);
}

.user-location::after {
  content: "";

  position: absolute;
  inset: -12px;

  border: 1px solid rgba(25,118,255,.65);
  border-radius: 50%;

  animation: pulse 2s infinite;
}

@keyframes pulse {

  0% {
    transform: scale(.55);
    opacity: 1;
  }

  100% {
    transform: scale(1.5);
    opacity: 0;
  }

}


/* =========================================================
   RIGHT BUTTONS
========================================================= */

.map-tools {
  position: absolute;

  right: 15px;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  z-index: 1000;
}

.round-button,
.location-button {
  width: 56px;
  height: 56px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255,255,255,.9);
  border-radius: 50%;

  background:
    radial-gradient(
      circle at 30% 22%,
      #fff,
      #d3d3d3 16%,
      #858585 38%,
      #363636 62%,
      #0b0b0b 84%
    );

  color: #fff;

  box-shadow:
    0 10px 28px rgba(0,0,0,.55),
    0 0 0 3px rgba(255,255,255,.08),
    inset 0 2px 2px rgba(255,255,255,.8);
}

.location-button {
  position: absolute;

  right: 15px;

  bottom:
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  z-index: 1000;
}

.round-button:active,
.location-button:active {
  transform: scale(.94);
}


/* LAYERS ICON */

.layers-symbol {
  position: relative;

  width: 25px;
  height: 22px;
}

.layers-symbol::before,
.layers-symbol::after {
  content: "";

  position: absolute;

  left: 2px;

  width: 21px;
  height: 10px;

  border: 2px solid #fff;

  transform: rotate(30deg) skewX(-28deg);
}

.layers-symbol::before {
  top: 1px;
}

.layers-symbol::after {
  top: 8px;
}


/* LOCATION ICON */

.location-symbol {
  position: relative;

  width: 21px;
  height: 21px;

  border: 2px solid #fff;
  border-radius: 50%;
}

.location-symbol::before {
  content: "";

  position: absolute;

  top: 5px;
  left: 5px;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #fff;
}


/* =========================================================
   LAYER PANEL
========================================================= */

.layer-panel {
  position: absolute;

  right: 13px;

  bottom:
    calc(
      171px +
      env(safe-area-inset-bottom)
    );

  z-index: 1100;

  width: 245px;

  padding: 15px;

  border: 1px solid rgba(255,255,255,.58);
  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      rgba(125,125,125,.97),
      rgba(28,28,28,.98) 37%,
      rgba(5,5,5,.98)
    );

  backdrop-filter: blur(20px);

  box-shadow:
    0 15px 42px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.65);

  opacity: 0;

  transform:
    translateY(10px)
    scale(.96);

  pointer-events: none;

  transition: .2s;
}

.layer-panel.show {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);

  pointer-events: auto;
}

.layer-title {
  font-size: 10px;
  font-weight: 900;

  letter-spacing: .18em;
}

.layer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-top: 14px;
}

.layer-name {
  font-size: 11px;
  font-weight: 800;
}

.switch {
  position: relative;

  width: 45px;
  height: 25px;

  padding: 0;

  border: 1px solid rgba(255,255,255,.2);
  border-radius: 99px;

  background: #292929;
}

.switch::after {
  content: "";

  position: absolute;

  top: 3px;
  left: 3px;

  width: 17px;
  height: 17px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa
    );

  transition: .2s;
}

.switch.active {
  background: #a0a0a0;
}

.switch.active::after {
  left: 23px;
}

.opacity-area {
  margin-top: 14px;
  padding-top: 12px;

  border-top: 1px solid rgba(255,255,255,.14);
}

.opacity-head {
  display: flex;
  justify-content: space-between;

  margin-bottom: 7px;
}

.opacity-label,
.opacity-value {
  font-size: 9px;
  font-weight: 800;
}

.opacity-label {
  color: #aaa;
}

.opacity-slider {
  width: 100%;

  accent-color: #fff;
}


/* =========================================================
   OFFICIAL MAP
========================================================= */

#officialMap {
  position: absolute;
  inset: 0;

  z-index: 500;

  display: none;

  padding:
    calc(138px + env(safe-area-inset-top))
    6px
    calc(8px + env(safe-area-inset-bottom));

  background:
    radial-gradient(
      circle at 50% 40%,
      #333,
      #050505 70%
    );
}

#officialMap.show {
  display: block;
}

.official-scroll {
  width: 100%;
  height: 100%;

  overflow: auto;

  display: flex;
  align-items: center;
  justify-content: center;

  -webkit-overflow-scrolling: touch;
}

.official-scroll img {
  display: block;

  width: 100%;
  height: auto;

  max-width: 1100px;

  border: 1px solid rgba(255,255,255,.55);
  border-radius: 14px;

  box-shadow:
    0 16px 50px rgba(0,0,0,.7);
}


/* =========================================================
   DETAIL SHEET
========================================================= */

.sheet-backdrop {
  position: fixed;
  inset: 0;

  z-index: 1998;

  background: rgba(0,0,0,.25);

  opacity: 0;

  pointer-events: none;

  transition: .2s;
}

.sheet-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}

.bottom-sheet {
  position: fixed;

  left: 10px;
  right: 10px;

  bottom:
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  z-index: 2000;

  padding: 11px 18px 19px;

  border: 1px solid rgba(255,255,255,.58);
  border-radius: 24px;

  background:
    linear-gradient(
      135deg,
      rgba(120,120,120,.97),
      rgba(32,32,32,.98) 32%,
      rgba(6,6,6,.99) 67%,
      rgba(70,70,70,.98)
    );

  backdrop-filter: blur(24px);

  box-shadow:
    0 -12px 55px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.7);

  transform:
    translateY(
      calc(100% + 60px)
    );

  transition:
    transform
    .34s
    cubic-bezier(.22,.75,.25,1);
}

.bottom-sheet.show {
  transform: translateY(0);
}

.sheet-handle {
  width: 43px;
  height: 4px;

  margin: 0 auto 17px;

  border-radius: 99px;

  background:
    linear-gradient(
      90deg,
      #777,
      #fff,
      #777
    );
}

.sheet-category {
  margin-bottom: 5px;

  color: #bbb;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: .18em;
}

.sheet-title {
  font-size: 23px;
  font-weight: 900;
}

.sheet-line {
  height: 1px;

  margin: 14px 0;

  background:
    linear-gradient(
      90deg,
      #fff,
      #999 35%,
      transparent
    );
}

.sheet-description {
  color: #ddd;

  font-size: 13px;

  line-height: 1.65;
}

.sheet-close {
  width: 100%;

  margin-top: 16px;
  padding: 11px;

  border: 1px solid rgba(255,255,255,.45);
  border-radius: 10px;

  background: rgba(255,255,255,.10);

  color: #fff;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: .15em;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  left: 50%;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  z-index: 3000;

  padding: 10px 15px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 999px;

  background:
    linear-gradient(
      135deg,
      #777,
      #111
    );

  color: #fff;

  font-size: 10px;

  white-space: nowrap;

  opacity: 0;

  transform:
    translate(-50%,15px);

  pointer-events: none;

  transition: .2s;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%,0);
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:800px) {

  .header {
    width: 390px;
    right: auto;
  }

  .filters-wrap {
    width: 850px;
  }

  .bottom-sheet {
    width: 390px;

    left: 20px;
    right: auto;

    bottom: 20px;
  }

}

</style>
</head>

<body>

<div id="app">

  <div id="map"></div>


  <!-- OFFICIAL MAP -->

  <div id="officialMap">

    <div class="official-scroll">

      <img
        src="./Map.JPG"
        alt="BMSG FES 2026 会場マップ"
      >

    </div>

  </div>


  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="brand-main">
        BMSG FES 2026
      </div>

      <div class="brand-sub">
        VENUE NAVIGATOR
      </div>

    </div>


    <div class="mode-switch">

      <button
        class="mode-button active"
        data-mode="real"
      >
        REAL MAP
      </button>

      <button
        class="mode-button"
        data-mode="official"
      >
        OFFICIAL MAP
      </button>

    </div>

  </header>


  <!-- FILTER -->

  <div class="filters-wrap">

    <div class="filters">

      <button class="filter active" data-filter="all">
        ALL
      </button>

      <button class="filter" data-filter="stage">
        STAGE
      </button>

      <button class="filter" data-filter="gate">
        GATE
      </button>

      <button class="filter" data-filter="food">
        FOOD
      </button>

      <button class="filter" data-filter="goods">
        GOODS
      </button>

      <button class="filter" data-filter="wc">
        WC
      </button>

      <button class="filter" data-filter="photo">
        PHOTO
      </button>

      <button class="filter" data-filter="info">
        INFO
      </button>

      <button class="filter" data-filter="booth">
        BOOTH
      </button>

    </div>

  </div>


  <!-- LAYERS -->

  <div
    class="map-tools"
    id="mapTools"
  >

    <button
      class="round-button"
      id="layersButton"
      aria-label="マップレイヤー"
    >
      <span class="layers-symbol"></span>
    </button>

  </div>


  <!-- LOCATION -->

  <button
    class="location-button"
    id="locationButton"
    aria-label="現在地"
  >
    <span class="location-symbol"></span>
  </button>


  <!-- PANEL -->

  <div
    class="layer-panel"
    id="layerPanel"
  >

    <div class="layer-title">
      MAP LAYERS
    </div>


    <div class="layer-row">

      <div class="layer-name">
        VENUE OVERLAY
      </div>

      <button
        class="switch"
        id="overlaySwitch"
      ></button>

    </div>


    <div class="opacity-area">

      <div class="opacity-head">

        <span class="opacity-label">
          OPACITY
        </span>

        <span
          class="opacity-value"
          id="opacityValue"
        >
          50%
        </span>

      </div>

      <input
        class="opacity-slider"
        id="opacitySlider"
        type="range"
        min="10"
        max="90"
        value="50"
      >

    </div>

  </div>

</div>


<!-- DETAIL -->

<div
  class="sheet-backdrop"
  id="sheetBackdrop"
></div>


<div
  class="bottom-sheet"
  id="bottomSheet"
>

  <div class="sheet-handle"></div>

  <div
    class="sheet-category"
    id="sheetCategory"
  ></div>

  <div
    class="sheet-title"
    id="sheetTitle"
  ></div>

  <div class="sheet-line"></div>

  <div
    class="sheet-description"
    id="sheetDescription"
  ></div>

  <button
    class="sheet-close"
    id="sheetClose"
  >
    CLOSE
  </button>

</div>


<div
  class="toast"
  id="toast"
></div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script>

/* =========================================================
   MAP CALIBRATION
========================================================= */

/*
  -----------------------------------------------------------
  IMPORTANT
  -----------------------------------------------------------

  施設の緯度経度を1個ずつ書く方式ではありません。

  Map.JPG 内の位置を
      x = 左から何%
      y = 上から何%

  として保存。

  ↓

  その位置をREAL MAP上へ自動変換します。

  つまり、後で公式MAP全体の位置を微調整しても
  全施設が一緒についてきます。


  ※公式MAPは模式図なので、
    測量図レベルのGPS精度ではありません。
*/


/*
  Map.JPGをREAL MAPに置く範囲。

  ★ 最終微調整ポイントはここだけ ★

  [南西]
  [北東]
*/

const VENUE_BOUNDS = {

  south: 35.62235,

  west: 139.77275,

  north: 35.62770,

  east: 139.77920

};

/* =========================================================
   IMAGE POSITION → GPS
========================================================= */

function imagePositionToLatLng(
  x,
  y
) {

  /*
    x:
    0 = 左
    100 = 右

    y:
    0 = 上
    100 = 下
  */

  const lng =
    VENUE_BOUNDS.west
    +
    (
      VENUE_BOUNDS.east
      -
      VENUE_BOUNDS.west
    )
    *
    (
      x / 100
    );


  const lat =
    VENUE_BOUNDS.north
    -
    (
      VENUE_BOUNDS.north
      -
      VENUE_BOUNDS.south
    )
    *
    (
      y / 100
    );


  return [
    lat,
    lng
  ];

}

      class="
        venue-marker
        marker-${venue.category}
        ${isStage ? "stage-marker" : ""}
      "
    >

      <div class="marker-pin">

        <div class="marker-inner">

          ${icons[venue.category]}

        </div>

      </div>

      <div class="marker-label">

        ${venue.label}

      </div>

    </div>

  `;


  return L.divIcon({

    className: "",

    html: html,

    iconSize:
      [
        isStage
          ? 155
          : 125,

        isStage
          ? 85
          : 72
      ],

    iconAnchor:
      [
        0,
        isStage
          ? 55
          : 43
      ]

  });

}

/*
  -----------------------------------------------------------
  PRIVACY
  -----------------------------------------------------------

  現在地は：

  ・この端末のブラウザで取得
  ・サーバーへ送信しない
  ・Cloudflareへ保存しない
  ・DBへ保存しない
  ・KVへ保存しない
  ・localStorageにも保存しない

  ページを閉じれば監視終了。
*/

let locationMarker = null;

let accuracyCircle = null;

let watchId = null;

let firstLocation = true;


const userIcon =
  L.divIcon({

    className: "",

    html:
      '<div class="user-location"></div>',

    iconSize:
      [22,22],

    iconAnchor:
      [11,11]

  });


locationButton.addEventListener(
  "click",
  () => {

    /*
      すでに現在地取得済み
    */

    if (
      locationMarker
    ) {

      map.flyTo(

        locationMarker.getLatLng(),

        18,

        {
          duration: .8
        }

      );

      return;

    }


    if (
      !navigator.geolocation
    ) {

      showToast(
        "この端末では位置情報を利用できません"
      );

      return;

    }


    showToast(
      "現在地を取得しています…"
    );


    watchId =
      navigator.geolocation.watchPosition(

        locationSuccess,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            15000

        }

      );

  }
);


function locationSuccess(
  position
) {

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  if (
    !locationMarker
  ) {

    locationMarker =
      L.marker(

        [
          lat,
          lng
        ],

        {

          icon:
            userIcon,

          pane:
            "userLocationPane"

        }

      ).addTo(
        map
      );

  }

  else {

    locationMarker.setLatLng(
      [
        lat,
        lng
      ]
    );

  }


  /*
    GPS精度円
  */

  if (
    !accuracyCircle
  ) {

    accuracyCircle =
      L.circle(

        [
          lat,
          lng
        ],

        {

          radius:
            accuracy,

          color:
            "#1976ff",

          weight:
            1,

          opacity:
            .5,

          fillColor:
            "#1976ff",

          fillOpacity:
            .08,

          pane:
            "userLocationPane"

        }

      ).addTo(
        map
      );

  }

  else {

    accuracyCircle.setLatLng(
      [
        lat,
        lng
      ]
    );


    accuracyCircle.setRadius(
      accuracy
    );

  }


  /*
    最初だけ自動移動
  */

  if (
    firstLocation
  ) {

    firstLocation =
      false;


    map.flyTo(

      [
        lat,
        lng
      ],

      18,

      {
        duration: 1
      }

    );


    showToast(
      "現在地を表示しました"
    );

  }

}


/* =========================================================
   LOCATION ERROR
========================================================= */

function locationError(
  error
) {

  let message =
    "現在地を取得できませんでした";


  if (
    error.code === 1
  ) {

    message =
      "位置情報の利用が許可されていません";

  }


  if (
    error.code === 2
  ) {

    message =
      "現在地を確認できませんでした";

  }


  if (
    error.code === 3
  ) {

    message =
      "現在地の取得がタイムアウトしました";

  }


  showToast(
    message
  );

}


/* =========================================================
   TOAST
========================================================= */

const toast =
  document.getElementById(
    "toast"
  );

let toastTimer;


function showToast(
  message
) {

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },

      2300
    );

}


/* =========================================================
   CLEAN UP
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    if (
      watchId !== null
    ) {

      navigator.geolocation.clearWatch(
        watchId
      );

    }

  }
);

</script>
