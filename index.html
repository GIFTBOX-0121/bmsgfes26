<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BMSG FES 2026 | VENUE NAVIGATOR</title>
<meta name="theme-color" content="#090909">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   BASE
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #050505;
  color: #f5f5f5;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button,
input {
  font: inherit;
}

#app {
  position: fixed;
  inset: 0;
  background: #050505;
}


/* =========================================================
   REAL MAP
========================================================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: #d9d9d9;
}

.leaflet-control-zoom {
  display: none;
}

.leaflet-control-attribution {
  background: rgba(8,8,8,.75) !important;
  color: #ccc !important;
  font-size: 9px !important;
}

.leaflet-control-attribution a {
  color: #fff !important;
}


/*
  完全モノクロを廃止。

  元の地図の色を残しつつ、
  少し落ち着かせる。
*/

.leaflet-tile-pane {
  filter:
    saturate(.78)
    brightness(.93)
    contrast(.96);
}


/* =========================================================
   HEADER
========================================================= */

.header {
  position: absolute;

  top: calc(12px + env(safe-area-inset-top));
  left: 14px;
  right: 14px;

  z-index: 1000;

  border: 1px solid rgba(255,255,255,.55);
  border-radius: 19px;

  background:
    linear-gradient(
      125deg,
      rgba(215,215,215,.38) 0%,
      rgba(105,105,105,.42) 20%,
      rgba(30,30,30,.94) 48%,
      rgba(80,80,80,.72) 75%,
      rgba(190,190,190,.32) 100%
    );

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow:
    0 14px 45px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -1px 0 rgba(255,255,255,.12);

  overflow: hidden;
}

.header::before {
  content: "";

  position: absolute;

  top: 0;
  left: 6%;
  right: 6%;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff,
      #aaa,
      #fff,
      transparent
    );
}

.header::after {
  content: "";

  position: absolute;

  width: 180px;
  height: 220px;

  top: -120px;
  right: -50px;

  transform: rotate(25deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.11),
      transparent
    );

  pointer-events: none;
}


/* =========================================================
   BRAND
========================================================= */

.brand {
  position: relative;
  z-index: 2;

  padding: 15px 16px 10px;
}

.brand-main {
  font-size: 18px;
  font-weight: 850;
  letter-spacing: .15em;

  color: #fff;

  text-shadow:
    0 1px 0 #000,
    0 0 15px rgba(255,255,255,.12);
}

.brand-sub {
  margin-top: 4px;

  color: #ddd;

  font-size: 9px;
  font-weight: 600;
  letter-spacing: .34em;
}


/* =========================================================
   MODE SWITCH
========================================================= */

.mode-switch {
  position: relative;
  z-index: 2;

  display: flex;

  margin: 0 10px 10px;
  padding: 3px;

  border: 1px solid rgba(255,255,255,.28);
  border-radius: 11px;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.36),
      rgba(255,255,255,.08)
    );
}

.mode-button {
  flex: 1;

  border: 0;
  border-radius: 8px;

  padding: 9px;

  background: transparent;
  color: #aaa;

  font-size: 10px;
  font-weight: 800;
  letter-spacing: .15em;

  cursor: pointer;
}

.mode-button.active {
  color: #080808;

  background:
    linear-gradient(
      135deg,
      #fff 0%,
      #d8d8d8 22%,
      #8d8d8d 52%,
      #ededed 78%,
      #9d9d9d 100%
    );

  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -1px 0 rgba(0,0,0,.25),
    0 3px 12px rgba(0,0,0,.32);
}


/* =========================================================
   FILTER BAR
========================================================= */

.filters-wrap {
  position: absolute;

  top: calc(134px + env(safe-area-inset-top));

  left: 0;
  right: 0;

  z-index: 900;

  overflow: hidden;
}

.filters {
  display: flex;
  gap: 7px;

  overflow-x: auto;

  padding: 6px 14px 10px;

  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {
  flex: 0 0 auto;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 999px;

  padding: 8px 14px;

  background:
    linear-gradient(
      145deg,
      rgba(95,95,95,.94),
      rgba(18,18,18,.94)
    );

  color: #ddd;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    0 5px 15px rgba(0,0,0,.28);

  font-size: 9px;
  font-weight: 800;
  letter-spacing: .08em;

  cursor: pointer;
}

.filter.active {
  color: #080808;

  border-color: #fff;

  background:
    linear-gradient(
      135deg,
      #fafafa,
      #bdbdbd 35%,
      #858585 57%,
      #e8e8e8
    );
}


/* =========================================================
   MARKERS
========================================================= */

.map-marker {
  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;

  width: max-content;

  transform: translateX(-50%);
}

.marker-pin {
  position: relative;

  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,.95);

  background:
    linear-gradient(
      145deg,
      #fafafa,
      #969696 23%,
      #3c3c3c 50%,
      #d8d8d8 77%,
      #707070
    );

  box-shadow:
    0 7px 20px rgba(0,0,0,.7),
    0 0 0 2px rgba(0,0,0,.45),
    inset 0 1px 1px #fff;

  z-index: 2;
}

.marker-inner {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: var(--marker-color);

  border: 1px solid rgba(255,255,255,.65);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.35),
    inset 0 -4px 10px rgba(0,0,0,.25),
    0 0 10px var(--marker-glow);
}

.marker-inner svg {
  width: 19px;
  height: 19px;

  stroke: #fff;

  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;

  fill: none;
}

.marker-pin::after {
  content: "";

  position: absolute;

  width: 9px;
  height: 9px;

  bottom: -5px;

  transform: rotate(45deg);

  background: #aaa;

  border-right: 1px solid #fff;
  border-bottom: 1px solid #fff;

  z-index: -1;
}

.marker-label {
  margin-top: 8px;

  padding: 4px 7px;

  max-width: 135px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 6px;

  background: rgba(5,5,5,.88);

  color: #fff;

  box-shadow:
    0 3px 10px rgba(0,0,0,.6);

  backdrop-filter: blur(7px);

  font-size: 9px;
  font-weight: 800;

  line-height: 1.1;

  white-space: nowrap;

  text-align: center;
}


/* =========================================================
   MARKER COLORS
========================================================= */

.marker-stage {
  --marker-color: #684cff;
  --marker-glow: rgba(104,76,255,.8);
}

.marker-food {
  --marker-color: #ff7418;
  --marker-glow: rgba(255,116,24,.75);
}

.marker-goods {
  --marker-color: #00aeea;
  --marker-glow: rgba(0,174,234,.75);
}

.marker-wc {
  --marker-color: #1769ff;
  --marker-glow: rgba(23,105,255,.75);
}

.marker-photo {
  --marker-color: #e94bb7;
  --marker-glow: rgba(233,75,183,.75);
}

.marker-gate {
  --marker-color: #00a76f;
  --marker-glow: rgba(0,167,111,.75);
}

.marker-info {
  --marker-color: #d8a900;
  --marker-glow: rgba(216,169,0,.75);
}

.marker-bar {
  --marker-color: #e13b42;
  --marker-glow: rgba(225,59,66,.75);
}

.marker-station {
  --marker-color: #58616b;
  --marker-glow: rgba(220,230,240,.6);
}


/* STAGE = BIG */

.map-marker.stage-marker .marker-pin {
  width: 54px;
  height: 54px;
}

.map-marker.stage-marker .marker-inner {
  width: 42px;
  height: 42px;
}

.map-marker.stage-marker .marker-inner svg {
  width: 24px;
  height: 24px;
}

.map-marker.stage-marker .marker-label {
  padding: 5px 9px;
  font-size: 10px;
}


/* =========================================================
   MAP TOOL BUTTON
========================================================= */

.map-tools {
  position: absolute;

  right: 16px;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  z-index: 1000;

  display: flex;
  flex-direction: column;
  gap: 9px;
}

.tool-button {
  width: 58px;
  height: 58px;

  border: 1px solid rgba(255,255,255,.88);
  border-radius: 50%;

  background:
    radial-gradient(
      circle at 30% 22%,
      #fff 0%,
      #d5d5d5 15%,
      #858585 38%,
      #3c3c3c 60%,
      #101010 82%
    );

  color: #fff;

  box-shadow:
    0 12px 30px rgba(0,0,0,.55),
    0 0 0 3px rgba(255,255,255,.09),
    inset 0 2px 2px rgba(255,255,255,.8);

  cursor: pointer;
}

.tool-button:active {
  transform: scale(.94);
}

.layers-icon {
  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 2px;
}

.layers-icon span {
  display: block;

  width: 22px;
  height: 6px;

  border: 1.5px solid #fff;

  transform: skewX(-28deg);

  box-shadow:
    0 1px 2px #000;
}


/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-button {
  position: absolute;

  right: 16px;

  bottom:
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  z-index: 1000;

  width: 58px;
  height: 58px;

  border: 1px solid rgba(255,255,255,.88);
  border-radius: 50%;

  background:
    radial-gradient(
      circle at 30% 22%,
      #fff 0%,
      #d5d5d5 15%,
      #858585 38%,
      #3c3c3c 60%,
      #101010 82%
    );

  box-shadow:
    0 12px 30px rgba(0,0,0,.6),
    0 0 0 3px rgba(255,255,255,.09),
    inset 0 2px 2px rgba(255,255,255,.8);

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.location-symbol {
  position: relative;

  width: 21px;
  height: 21px;

  border: 2px solid #fff;
  border-radius: 50%;
}

.location-symbol::before {
  content: "";

  position: absolute;

  width: 7px;
  height: 7px;

  top: 5px;
  left: 5px;

  border-radius: 50%;

  background: #fff;

  box-shadow:
    0 0 7px #fff,
    0 0 13px rgba(255,255,255,.75);
}

.location-symbol::after {
  content: "";

  position: absolute;

  width: 2px;
  height: 29px;

  top: -6px;
  left: 7.5px;

  background:
    linear-gradient(
      transparent 0 11%,
      #fff 11% 28%,
      transparent 28% 72%,
      #fff 72% 89%,
      transparent 89%
    );
}


/* =========================================================
   USER LOCATION
========================================================= */

.user-location {
  position: relative;

  width: 22px;
  height: 22px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff,
      #d6d6d6 38%,
      #727272
    );

  border: 3px solid #fff;

  box-shadow:
    0 0 0 5px rgba(255,255,255,.18),
    0 0 12px #fff,
    0 0 28px rgba(255,255,255,.65);
}

.user-location::after {
  content: "";

  position: absolute;
  inset: -12px;

  border: 1px solid rgba(255,255,255,.58);
  border-radius: 50%;

  animation: locationPulse 2s infinite;
}

@keyframes locationPulse {

  0% {
    transform: scale(.55);
    opacity: 1;
  }

  100% {
    transform: scale(1.55);
    opacity: 0;
  }

}


/* =========================================================
   LAYER PANEL
========================================================= */

.layer-panel {
  position: absolute;

  right: 14px;

  bottom:
    calc(
      172px +
      env(safe-area-inset-bottom)
    );

  z-index: 1100;

  width: 245px;

  padding: 15px;

  border: 1px solid rgba(255,255,255,.58);
  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      rgba(125,125,125,.96),
      rgba(30,30,30,.97) 35%,
      rgba(7,7,7,.98) 75%
    );

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  box-shadow:
    0 16px 45px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.6);

  transform:
    translateY(10px)
    scale(.96);

  opacity: 0;
  pointer-events: none;

  transition: .2s ease;
}

.layer-panel.show {
  transform:
    translateY(0)
    scale(1);

  opacity: 1;
  pointer-events: auto;
}

.layer-title {
  color: #fff;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: .18em;
}

.layer-row {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-top: 14px;
}

.layer-name {
  font-size: 12px;
  font-weight: 700;

  color: #eee;
}


/* SWITCH */

.switch {
  position: relative;

  width: 44px;
  height: 25px;

  border: 0;

  border-radius: 99px;

  background: #303030;

  box-shadow:
    inset 0 2px 5px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,255,255,.22);

  cursor: pointer;
}

.switch::after {
  content: "";

  position: absolute;

  width: 19px;
  height: 19px;

  top: 3px;
  left: 3px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa
    );

  box-shadow:
    0 2px 5px rgba(0,0,0,.5);

  transition: .2s ease;
}

.switch.active {
  background:
    linear-gradient(
      90deg,
      #777,
      #d7d7d7
    );
}

.switch.active::after {
  left: 22px;
}


/* OPACITY */

.opacity-area {
  margin-top: 15px;

  padding-top: 13px;

  border-top: 1px solid rgba(255,255,255,.15);
}

.opacity-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 8px;
}

.opacity-label {
  color: #aaa;

  font-size: 9px;
  font-weight: 700;

  letter-spacing: .12em;
}

.opacity-value {
  color: #fff;

  font-size: 10px;
  font-weight: 800;
}

.opacity-slider {
  width: 100%;

  accent-color: #fff;
}


/* =========================================================
   BOTTOM SHEET
========================================================= */

.sheet-backdrop {
  position: fixed;
  inset: 0;

  z-index: 1998;

  background: rgba(0,0,0,.28);

  opacity: 0;
  pointer-events: none;

  transition: opacity .25s ease;
}

.sheet-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}

.bottom-sheet {
  position: fixed;

  left: 10px;
  right: 10px;

  bottom:
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  z-index: 2000;

  border: 1px solid rgba(255,255,255,.55);
  border-radius: 25px;

  padding: 11px 18px 20px;

  background:
    linear-gradient(
      135deg,
      rgba(110,110,110,.96),
      rgba(35,35,35,.98) 30%,
      rgba(8,8,8,.98) 65%,
      rgba(68,68,68,.97)
    );

  backdrop-filter: blur(24px);

  box-shadow:
    0 -12px 55px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.7);

  transform:
    translateY(
      calc(100% + 50px)
    );

  transition:
    transform
    .35s
    cubic-bezier(.22,.75,.25,1);
}

.bottom-sheet.show {
  transform: translateY(0);
}

.sheet-handle {
  width: 45px;
  height: 4px;

  margin: 0 auto 18px;

  border-radius: 99px;

  background:
    linear-gradient(
      90deg,
      #777,
      #fff,
      #777
    );
}

.sheet-number {
  margin-bottom: 6px;

  color: #c5c5c5;

  font-size: 9px;
  font-weight: 800;

  letter-spacing: .25em;
}

.sheet-title {
  color: #fff;

  font-size: 25px;
  font-weight: 850;
}

.sheet-line {
  height: 1px;

  margin: 15px 0;

  background:
    linear-gradient(
      90deg,
      #fff,
      #aaa 35%,
      transparent
    );
}

.sheet-description {
  color: #d0d0d0;

  font-size: 13px;
  line-height: 1.7;
}

.sheet-close {
  width: 100%;

  margin-top: 18px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 11px;

  padding: 11px;

  background:
    linear-gradient(
      135deg,
      rgba(210,210,210,.24),
      rgba(55,55,55,.35)
    );

  color: #f0f0f0;

  font-size: 10px;
  font-weight: 800;
  letter-spacing: .18em;
}


/* =========================================================
   OFFICIAL MAP
========================================================= */

#officialMap {
  position: absolute;
  inset: 0;

  z-index: 500;

  display: none;

  background:
    radial-gradient(
      circle at 50% 40%,
      #303030,
      #080808 65%
    );

  padding:
    calc(145px + env(safe-area-inset-top))
    8px
    calc(10px + env(safe-area-inset-bottom));
}

#officialMap.show {
  display: flex;
}

.official-map-container {
  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: auto;

  -webkit-overflow-scrolling: touch;
}

.official-map-image {
  display: block;

  width: 100%;
  height: auto;

  max-width: 1100px;

  border: 1px solid rgba(255,255,255,.55);
  border-radius: 15px;

  box-shadow:
    0 18px 50px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,.08);
}


/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  left: 50%;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  z-index: 3000;

  max-width: calc(100% - 40px);

  padding: 10px 16px;

  border: 1px solid rgba(255,255,255,.48);
  border-radius: 999px;

  background:
    linear-gradient(
      135deg,
      rgba(105,105,105,.96),
      rgba(15,15,15,.96)
    );

  color: #fff;

  font-size: 11px;

  white-space: nowrap;

  transform:
    translateX(-50%)
    translateY(15px);

  opacity: 0;
  pointer-events: none;

  transition: .25s ease;
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 800px) {

  .header {
    width: 390px;
    right: auto;
  }

  .filters-wrap {
    width: 750px;
  }

  .bottom-sheet {
    width: 390px;

    left: 20px;
    right: auto;

    bottom: 20px;
  }

}

</style>
</head>


<body>

<div id="app">

  <!-- REAL MAP -->
  <div id="map"></div>


  <!-- OFFICIAL MAP -->
  <div id="officialMap">

    <div class="official-map-container">

      <img
        src="./Map.JPG"
        alt="BMSG FES 2026 OFFICIAL VENUE MAP"
        class="official-map-image"
      >

    </div>

  </div>


  <!-- HEADER -->
  <header class="header">

    <div class="brand">

      <div class="brand-main">
        BMSG FES 2026
      </div>

      <div class="brand-sub">
        VENUE NAVIGATOR
      </div>

    </div>


    <div class="mode-switch">

      <button
        class="mode-button active"
        data-mode="real"
      >
        REAL MAP
      </button>

      <button
        class="mode-button"
        data-mode="official"
      >
        OFFICIAL MAP
      </button>

    </div>

  </header>


  <!-- FILTERS -->
  <div class="filters-wrap">

    <div class="filters">

      <button class="filter active" data-filter="all">
        ALL
      </button>

      <button class="filter" data-filter="stage">
        STAGE
      </button>

      <button class="filter" data-filter="food">
        FOOD
      </button>

      <button class="filter" data-filter="goods">
        GOODS
      </button>

      <button class="filter" data-filter="wc">
        WC
      </button>

      <button class="filter" data-filter="photo">
        PHOTO
      </button>

      <button class="filter" data-filter="gate">
        GATE
      </button>

      <button class="filter" data-filter="info">
        INFO
      </button>

    </div>

  </div>


  <!-- MAP TOOLS -->
  <div
    class="map-tools"
    id="mapTools"
  >

    <button
      class="tool-button"
      id="layersButton"
      aria-label="レイヤー"
    >

      <span class="layers-icon">
        <span></span>
        <span></span>
        <span></span>
      </span>

    </button>

  </div>


  <!-- LOCATION -->
  <button
    class="location-button"
    id="locationButton"
    aria-label="現在地を表示"
  >
    <span class="location-symbol"></span>
  </button>


  <!-- LAYER PANEL -->
  <div
    class="layer-panel"
    id="layerPanel"
  >

    <div class="layer-title">
      MAP LAYERS
    </div>


    <div class="layer-row">

      <div class="layer-name">
        VENUE OVERLAY
      </div>

      <button
        class="switch"
        id="overlaySwitch"
        aria-label="会場マップを重ねる"
      ></button>

    </div>


    <div class="opacity-area">

      <div class="opacity-head">

        <span class="opacity-label">
          OPACITY
        </span>

        <span
          class="opacity-value"
          id="opacityValue"
        >
          55%
        </span>

      </div>


      <input
        class="opacity-slider"
        id="opacitySlider"
        type="range"
        min="10"
        max="90"
        value="55"
      >

    </div>

  </div>

</div>


<!-- BACKDROP -->
<div
  class="sheet-backdrop"
  id="sheetBackdrop"
></div>


<!-- BOTTOM SHEET -->
<div
  class="bottom-sheet"
  id="bottomSheet"
>

  <div class="sheet-handle"></div>

  <div
    class="sheet-number"
    id="sheetNumber"
  ></div>

  <div
    class="sheet-title"
    id="sheetTitle"
  ></div>

  <div class="sheet-line"></div>

  <div
    class="sheet-description"
    id="sheetDescription"
  ></div>

  <button
    class="sheet-close"
    id="sheetClose"
  >
    CLOSE
  </button>

</div>


<div
  class="toast"
  id="toast"
></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   ★★★ PCで後から調整する場所 ★★★
========================================================= */

/*
  REAL MAP上に重ねる
  Map.JPG の四隅。

  今は仮位置。

  PCで送ってくれた重ね合わせ画像を参考に
  ピッタリ合わせる。

  SOUTH = 南
  WEST  = 西
  NORTH = 北
  EAST  = 東
*/

const OVERLAY_BOUNDS = [

  /* SOUTH WEST */
  [
    35.6215,
    139.7720
  ],

  /* NORTH EAST */
  [
    35.6282,
    139.7800
  ]

];


/* =========================================================
   MAP
========================================================= */

const map = L.map(
  "map",
  {
    zoomControl: false,
    attributionControl: true
  }
).setView(
  [35.6252, 139.7756],
  16
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* =========================================================
   VENUE OVERLAY
========================================================= */

const venueOverlay =
  L.imageOverlay(

    "./Map.JPG",

    OVERLAY_BOUNDS,

    {
      opacity: .55,

      interactive: false,

      zIndex: 300
    }

  );

let overlayVisible = false;


/* =========================================================
   SVG ICONS
========================================================= */

const icons = {

stage: `
<svg viewBox="0 0 24 24">
  <rect x="9" y="3" width="6" height="11" rx="3"></rect>
  <path d="M6 11a6 6 0 0 0 12 0"></path>
  <path d="M12 17v4"></path>
  <path d="M9 21h6"></path>
</svg>
`,

food: `
<svg viewBox="0 0 24 24">
  <path d="M7 3v8"></path>
  <path d="M4 3v5a3 3 0 0 0 6 0V3"></path>
  <path d="M7 11v10"></path>
  <path d="M16 3v18"></path>
  <path d="M16 3c4 2 4 7 0 9"></path>
</svg>
`,

goods: `
<svg viewBox="0 0 24 24">
  <path d="M5 8h14l-1 13H6L5 8z"></path>
  <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
</svg>
`,

wc: `
<svg viewBox="0 0 24 24">
  <circle cx="7" cy="5" r="2"></circle>
  <path d="M7 8v6"></path>
  <path d="M4 11h6"></path>
  <path d="M5 21l2-7 2 7"></path>
  <circle cx="17" cy="5" r="2"></circle>
  <path d="M17 8l-4 8h8l-4-8z"></path>
  <path d="M17 16v5"></path>
</svg>
`,

photo: `
<svg viewBox="0 0 24 24">
  <path d="M4 7h4l2-3h4l2 3h4v13H4V7z"></path>
  <circle cx="12" cy="13" r="4"></circle>
</svg>
`,

gate: `
<svg viewBox="0 0 24 24">
  <path d="M4 21V5h16v16"></path>
  <path d="M8 21V9h8v12"></path>
  <path d="M3 5h18"></path>
</svg>
`,

info: `
<svg viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="9"></circle>
  <path d="M12 11v6"></path>
  <path d="M12 7h.01"></path>
</svg>
`,

bar: `
<svg viewBox="0 0 24 24">
  <path d="M5 4h14l-7 8-7-8z"></path>
  <path d="M12 12v7"></path>
  <path d="M8 20h8"></path>
</svg>
`,

station: `
<svg viewBox="0 0 24 24">
  <rect x="5" y="3" width="14" height="15" rx="2"></rect>
  <path d="M8 7h8"></path>
  <circle cx="9" cy="14" r="1"></circle>
  <circle cx="15" cy="14" r="1"></circle>
  <path d="M8 18l-2 3"></path>
  <path d="M16 18l2 3"></path>
</svg>
`

};


/* =========================================================
   VENUES
========================================================= */

/*
  ★ 今は仮座標 ★

  PCで本番位置に変更。
*/

const venues = [

  {
    id: 1,
    name: "MAIN STAGE",
    label: "MAIN STAGE",
    category: "stage",

    lat: 35.6260,
    lng: 139.7748,

    description:
      "MAIN STAGE。正確な位置・詳細情報は後から設定します。"
  },

  {
    id: 2,
    name: "SUB STAGE",
    label: "SUB STAGE",
    category: "stage",

    lat: 35.6252,
    lng: 139.7760,

    description:
      "SUB STAGE。正確な位置・詳細情報は後から設定します。"
  },

  {
    id: 3,
    name: "フードエリア",
    label: "フード",
    category: "food",

    lat: 35.6248,
    lng: 139.7749,

    description:
      "キッチンカー・フードエリア。"
  },

  {
    id: 4,
    name: "グッズ",
    label: "グッズ",
    category: "goods",

    lat: 35.6256,
    lng: 139.7767,

    description:
      "グッズ販売エリア。"
  },

  {
    id: 5,
    name: "トイレ",
    label: "トイレ",
    category: "wc",

    lat: 35.6244,
    lng: 139.7758,

    description:
      "トイレ。"
  },

  {
    id: 6,
    name: "フォトスポット",
    label: "フォト",
    category: "photo",

    lat: 35.6257,
    lng: 139.7739,

    description:
      "フォトスポット。"
  },

  {
    id: 7,
    name: "GATE",
    label: "ゲート",
    category: "gate",

    lat: 35.6239,
    lng: 139.7748,

    description:
      "入退場ゲート。"
  },

  {
    id: 8,
    name: "インフォメーション",
    label: "案内",
    category: "info",

    lat: 35.6249,
    lng: 139.7739,

    description:
      "インフォメーション。"
  }

];


/* =========================================================
   CREATE MARKER
========================================================= */

function createVenueIcon(venue) {

  const isStage =
    venue.category === "stage";

  const markerWidth =
    isStage ? 150 : 120;

  return L.divIcon({

    className: "",

    html: `

      <div
        class="
          map-marker
          marker-${venue.category}
          ${isStage ? "stage-marker" : ""}
        "
      >

        <div class="marker-pin">

          <div class="marker-inner">

            ${icons[venue.category]}

          </div>

        </div>

        <div class="marker-label">
          ${venue.label}
        </div>

      </div>

    `,

    iconSize:
      [
        markerWidth,
        85
      ],

    iconAnchor:
      [
        0,
        isStage ? 55 : 45
      ]

  });

}


/* =========================================================
   ADD MARKERS
========================================================= */

const venueMarkers = [];


venues.forEach(
  venue => {

    const marker =
      L.marker(

        [
          venue.lat,
          venue.lng
        ],

        {
          icon:
            createVenueIcon(
              venue
            ),

          zIndexOffset:
            1000
        }

      ).addTo(map);


    marker.on(
      "click",
      () => {

        openVenue(
          venue
        );

      }
    );


    venueMarkers.push({
      venue,
      marker
    });

  }
);


/* =========================================================
   LAYERS
========================================================= */

const layersButton =
  document.getElementById(
    "layersButton"
  );

const layerPanel =
  document.getElementById(
    "layerPanel"
  );

const overlaySwitch =
  document.getElementById(
    "overlaySwitch"
  );

const opacitySlider =
  document.getElementById(
    "opacitySlider"
  );

const opacityValue =
  document.getElementById(
    "opacityValue"
  );


layersButton.addEventListener(
  "click",
  () => {

    layerPanel.classList.toggle(
      "show"
    );

  }
);


overlaySwitch.addEventListener(
  "click",
  () => {

    overlayVisible =
      !overlayVisible;


    if (
      overlayVisible
    ) {

      venueOverlay.addTo(map);

      overlaySwitch.classList.add(
        "active"
      );

      showToast(
        "会場MAPを重ねました"
      );

    }

    else {

      if (
        map.hasLayer(
          venueOverlay
        )
      ) {

        map.removeLayer(
          venueOverlay
        );

      }


      overlaySwitch.classList.remove(
        "active"
      );

    }

  }
);


opacitySlider.addEventListener(
  "input",
  () => {

    const value =
      Number(
        opacitySlider.value
      );


    opacityValue.textContent =
      value + "%";


    venueOverlay.setOpacity(
      value / 100
    );

  }
);


/* =========================================================
   BOTTOM SHEET
========================================================= */

const bottomSheet =
  document.getElementById(
    "bottomSheet"
  );

const sheetBackdrop =
  document.getElementById(
    "sheetBackdrop"
  );

const sheetNumber =
  document.getElementById(
    "sheetNumber"
  );

const sheetTitle =
  document.getElementById(
    "sheetTitle"
  );

const sheetDescription =
  document.getElementById(
    "sheetDescription"
  );


function openVenue(venue) {

  sheetNumber.textContent =
    String(
      venue.id
    ).padStart(
      2,
      "0"
    )
    +
    " / "
    +
    venue.category.toUpperCase();


  sheetTitle.textContent =
    venue.name;


  sheetDescription.textContent =
    venue.description;


  bottomSheet.classList.add(
    "show"
  );

  sheetBackdrop.classList.add(
    "show"
  );

}


function closeVenue() {

  bottomSheet.classList.remove(
    "show"
  );

  sheetBackdrop.classList.remove(
    "show"
  );

}


document
  .getElementById(
    "sheetClose"
  )
  .addEventListener(
    "click",
    closeVenue
  );


sheetBackdrop.addEventListener(
  "click",
  closeVenue
);


/* =========================================================
   FILTER
========================================================= */

const filterButtons =
  document.querySelectorAll(
    ".filter"
  );


filterButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        filterButtons.forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        const category =
          button.dataset.filter;


        venueMarkers.forEach(
          ({
            venue,
            marker
          }) => {

            const show =
              category === "all"
              ||
              venue.category === category;


            if (show) {

              if (
                !map.hasLayer(
                  marker
                )
              ) {

                marker.addTo(map);

              }

            }

            else {

              if (
                map.hasLayer(
                  marker
                )
              ) {

                map.removeLayer(
                  marker
                );

              }

            }

          }
        );

      }
    );

  }
);


/* =========================================================
   REAL / OFFICIAL MODE
========================================================= */

const modeButtons =
  document.querySelectorAll(
    ".mode-button"
  );

const officialMap =
  document.getElementById(
    "officialMap"
  );

const filtersWrap =
  document.querySelector(
    ".filters-wrap"
  );

const mapTools =
  document.getElementById(
    "mapTools"
  );

const locationButton =
  document.getElementById(
    "locationButton"
  );


modeButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        modeButtons.forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        const mode =
          button.dataset.mode;


        if (
          mode === "official"
        ) {

          officialMap.classList.add(
            "show"
          );


          filtersWrap.style.display =
            "none";

          mapTools.style.display =
            "none";

          locationButton.style.display =
            "none";

          layerPanel.classList.remove(
            "show"
          );

        }

        else {

          officialMap.classList.remove(
            "show"
          );


          filtersWrap.style.display =
            "";

          mapTools.style.display =
            "";

          locationButton.style.display =
            "";


          setTimeout(
            () => {

              map.invalidateSize();

            },
            100
          );

        }

      }
    );

  }
);


/* =========================================================
   CURRENT LOCATION
========================================================= */

/*
  現在地：

  ・ブラウザ内のみ
  ・サーバー送信なし
  ・DB保存なし
  ・KV保存なし
  ・localStorage保存なし
  ・ページ終了時にwatch終了
*/

let locationMarker = null;

let accuracyCircle = null;

let watchId = null;

let hasCenteredLocation = false;


const userIcon =
  L.divIcon({

    className: "",

    html:
      `<div class="user-location"></div>`,

    iconSize:
      [22,22],

    iconAnchor:
      [11,11]

  });


locationButton.addEventListener(
  "click",
  () => {

    if (
      locationMarker
    ) {

      map.flyTo(

        locationMarker.getLatLng(),

        18,

        {
          duration: .8
        }

      );

      return;

    }


    if (
      !navigator.geolocation
    ) {

      showToast(
        "この端末では現在地を利用できません"
      );

      return;

    }


    showToast(
      "現在地を取得しています…"
    );


    watchId =
      navigator.geolocation.watchPosition(

        locationSuccess,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            3000,

          timeout:
            15000

        }

      );

  }
);


function locationSuccess(
  position
) {

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  if (
    !locationMarker
  ) {

    locationMarker =
      L.marker(

        [lat,lng],

        {

          icon:
            userIcon,

          zIndexOffset:
            10000

        }

      ).addTo(map);

  }

  else {

    locationMarker.setLatLng(
      [lat,lng]
    );

  }


  if (
    !accuracyCircle
  ) {

    accuracyCircle =
      L.circle(

        [lat,lng],

        {

          radius:
            accuracy,

          color:
            "#ffffff",

          weight:
            1,

          opacity:
            .55,

          fillColor:
            "#ffffff",

          fillOpacity:
            .10

        }

      ).addTo(map);

  }

  else {

    accuracyCircle.setLatLng(
      [lat,lng]
    );

    accuracyCircle.setRadius(
      accuracy
    );

  }


  /*
    現在地を一番上へ
  */

  if (
    locationMarker
  ) {

    locationMarker.setZIndexOffset(
      10000
    );

  }


  if (
    !hasCenteredLocation
  ) {

    hasCenteredLocation =
      true;


    map.flyTo(

      [lat,lng],

      18,

      {
        duration: 1
      }

    );


    showToast(
      "現在地を表示しました"
    );

  }

}


/* =========================================================
   LOCATION ERROR
========================================================= */

function locationError(
  error
) {

  let message =
    "現在地を取得できませんでした";


  if (
    error.code === 1
  ) {

    message =
      "位置情報の利用が許可されていません";

  }

  else if (
    error.code === 2
  ) {

    message =
      "現在地を確認できませんでした";

  }

  else if (
    error.code === 3
  ) {

    message =
      "現在地の取得がタイムアウトしました";

  }


  showToast(
    message
  );

}


/* =========================================================
   TOAST
========================================================= */

const toast =
  document.getElementById(
    "toast"
  );

let toastTimer;


function showToast(
  message
) {

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    if (
      watchId !== null
    ) {

      navigator.geolocation.clearWatch(
        watchId
      );

    }

  }
);

</script>

</body>
</html>
