<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>BMSG FES 2026 | VENUE NAVIGATOR</title>
<meta name="theme-color" content="#090909">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
}

#app{
  position:fixed;
  inset:0;
}

/* =========================================================
   MAP
========================================================= */

#map{
  position:absolute;
  inset:0;
  z-index:1;
  background:#ddd;
}

.leaflet-control-zoom{
  display:none;
}

.leaflet-control-attribution{
  background:rgba(5,5,5,.72)!important;
  color:#ccc!important;
  font-size:8px!important;
}

.leaflet-control-attribution a{
  color:#fff!important;
}

.leaflet-tile-pane{
  filter:
    saturate(.88)
    brightness(.98)
    contrast(.96);
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top));
  left:12px;
  right:12px;
  z-index:1000;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.58);
  border-radius:20px;

  background:
    linear-gradient(
      125deg,
      rgba(230,230,230,.40),
      rgba(115,115,115,.48) 20%,
      rgba(25,25,25,.95) 48%,
      rgba(88,88,88,.78) 74%,
      rgba(205,205,205,.32)
    );

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  box-shadow:
    0 14px 42px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.82);
}

.header::before{
  content:"";
  position:absolute;
  left:6%;
  right:6%;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,#fff,#999,#fff,transparent);
}

.brand{
  padding:14px 15px 9px;
}

.brand-main{
  font-size:18px;
  font-weight:900;
  letter-spacing:.13em;
}

.brand-sub{
  margin-top:3px;
  color:#ddd;
  font-size:8px;
  font-weight:700;
  letter-spacing:.30em;
}


/* =========================================================
   MODE
========================================================= */

.mode-switch{
  display:flex;
  margin:0 9px 9px;
  padding:3px;

  border:1px solid rgba(255,255,255,.25);
  border-radius:11px;

  background:rgba(0,0,0,.25);
}

.mode-button{
  flex:1;
  padding:9px 5px;

  border:0;
  border-radius:8px;

  background:transparent;
  color:#aaa;

  font-size:9px;
  font-weight:900;
  letter-spacing:.12em;
}

.mode-button.active{
  color:#080808;

  background:
    linear-gradient(
      135deg,
      #fff,
      #c7c7c7 32%,
      #888 55%,
      #eee
    );

  box-shadow:
    inset 0 1px 0 #fff,
    0 3px 12px rgba(0,0,0,.35);
}


/* =========================================================
   FILTER
========================================================= */

.filters-wrap{
  position:absolute;
  top:calc(130px + env(safe-area-inset-top));
  left:0;
  right:0;

  z-index:900;

  overflow:hidden;
}

.filters{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding:6px 12px 12px;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;

  padding:8px 13px;

  border:1px solid rgba(255,255,255,.48);
  border-radius:999px;

  background:
    linear-gradient(
      145deg,
      rgba(95,95,95,.94),
      rgba(12,12,12,.95)
    );

  color:#ddd;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    0 5px 14px rgba(0,0,0,.30);

  font-size:9px;
  font-weight:900;

  white-space:nowrap;
}

.filter.active{
  color:#080808;

  background:
    linear-gradient(
      135deg,
      #fff,
      #bdbdbd 38%,
      #858585 60%,
      #eee
    );
}


/* =========================================================
   MARKERS

   ★ 前回から重要変更
   Leafletのアイコン領域と見た目を一致させる
========================================================= */

.venue-marker{
  position:absolute;

  left:0;
  top:0;

  width:140px;
  height:70px;

  display:flex;
  flex-direction:column;
  align-items:center;

  pointer-events:auto;

  cursor:pointer;
}

.marker-hit{
  position:relative;

  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:auto;

  touch-action:none;
}

.marker-pin{
  position:relative;

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #fff;
  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #fff,
      #999 25%,
      #333 52%,
      #ddd 78%,
      #666
    );

  box-shadow:
    0 6px 17px rgba(0,0,0,.65),
    0 0 0 2px rgba(0,0,0,.35);
}

.marker-pin::after{
  content:"";

  position:absolute;

  left:50%;
  bottom:-5px;

  width:9px;
  height:9px;

  transform:
    translateX(-50%)
    rotate(45deg);

  background:#aaa;

  border-right:1px solid #fff;
  border-bottom:1px solid #fff;

  z-index:-1;
}

.marker-inner{
  width:31px;
  height:31px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--marker-color);

  border:1px solid rgba(255,255,255,.7);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.4),
    inset 0 -4px 8px rgba(0,0,0,.22),
    0 0 9px var(--marker-glow);
}

.marker-inner svg{
  width:18px;
  height:18px;

  fill:none;
  stroke:#fff;

  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.marker-label{
  margin-top:4px;

  max-width:138px;

  padding:4px 7px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.48);
  border-radius:6px;

  background:rgba(3,3,3,.88);

  color:#fff;

  box-shadow:
    0 3px 9px rgba(0,0,0,.6);

  font-size:8px;
  font-weight:900;

  line-height:1.1;

  text-overflow:ellipsis;
  white-space:nowrap;

  pointer-events:auto;
}


/* =========================================================
   COLORS
========================================================= */

.marker-stage{
  --marker-color:#704cff;
  --marker-glow:rgba(112,76,255,.8);
}

.marker-gate{
  --marker-color:#00a875;
  --marker-glow:rgba(0,168,117,.8);
}

.marker-food{
  --marker-color:#ff781e;
  --marker-glow:rgba(255,120,30,.8);
}

.marker-goods{
  --marker-color:#00aeea;
  --marker-glow:rgba(0,174,234,.8);
}

.marker-wc{
  --marker-color:#1769ff;
  --marker-glow:rgba(23,105,255,.8);
}

.marker-photo{
  --marker-color:#e64eb5;
  --marker-glow:rgba(230,78,181,.8);
}

.marker-info{
  --marker-color:#d5a600;
  --marker-glow:rgba(213,166,0,.8);
}

.marker-bar{
  --marker-color:#e33e46;
  --marker-glow:rgba(227,62,70,.8);
}

.marker-booth{
  --marker-color:#00a99d;
  --marker-glow:rgba(0,169,157,.8);
}

.marker-rest{
  --marker-color:#76808b;
  --marker-glow:rgba(180,190,200,.65);
}


/* STAGE */

.stage-marker .marker-hit{
  width:58px;
  height:58px;
}

.stage-marker .marker-pin{
  width:52px;
  height:52px;
}

.stage-marker .marker-inner{
  width:41px;
  height:41px;
}

.stage-marker .marker-inner svg{
  width:23px;
  height:23px;
}

.stage-marker .marker-label{
  font-size:10px;
}


/* =========================================================
   EDIT SELECTED
========================================================= */

body.editing .marker-hit{
  cursor:grab;
}

body.editing .marker-hit:active{
  cursor:grabbing;
}

body.editing .marker-pin{
  box-shadow:
    0 0 0 3px rgba(255,255,255,.65),
    0 0 20px rgba(255,255,255,.85),
    0 6px 17px rgba(0,0,0,.65);
}

.venue-marker.selected .marker-pin{
  box-shadow:
    0 0 0 4px #fff,
    0 0 0 8px rgba(255,255,255,.22),
    0 0 28px rgba(255,255,255,1);
}

.venue-marker.selected .marker-label{
  background:#fff;
  color:#050505;
}


/* =========================================================
   CURRENT LOCATION
========================================================= */

.user-location{
  position:relative;

  width:22px;
  height:22px;

  border:3px solid #fff;
  border-radius:50%;

  background:#1976ff;

  box-shadow:
    0 0 0 5px rgba(25,118,255,.18),
    0 0 14px rgba(25,118,255,.95),
    0 0 30px rgba(25,118,255,.55);
}

.user-location::after{
  content:"";

  position:absolute;
  inset:-12px;

  border:1px solid rgba(25,118,255,.65);
  border-radius:50%;

  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{
    transform:scale(.55);
    opacity:1;
  }

  100%{
    transform:scale(1.5);
    opacity:0;
  }
}


/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-button{
  position:absolute;

  right:15px;

  bottom:
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  z-index:1000;

  width:56px;
  height:56px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.9);
  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 22%,
      #fff,
      #d3d3d3 16%,
      #858585 38%,
      #363636 62%,
      #0b0b0b 84%
    );

  box-shadow:
    0 10px 28px rgba(0,0,0,.55),
    0 0 0 3px rgba(255,255,255,.08),
    inset 0 2px 2px rgba(255,255,255,.8);
}

.location-symbol{
  position:relative;

  width:21px;
  height:21px;

  border:2px solid #fff;
  border-radius:50%;
}

.location-symbol::before{
  content:"";

  position:absolute;

  top:5px;
  left:5px;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#fff;
}


/* =========================================================
   OFFICIAL MAP
========================================================= */

#officialMap{
  position:absolute;
  inset:0;

  z-index:500;

  display:none;

  padding:
    calc(138px + env(safe-area-inset-top))
    6px
    calc(8px + env(safe-area-inset-bottom));

  background:
    radial-gradient(
      circle at 50% 40%,
      #333,
      #050505 70%
    );
}

#officialMap.show{
  display:block;
}

.official-scroll{
  width:100%;
  height:100%;

  overflow:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  -webkit-overflow-scrolling:touch;
}

.official-scroll img{
  display:block;

  width:100%;
  height:auto;

  max-width:1100px;

  border:1px solid rgba(255,255,255,.55);
  border-radius:14px;

  box-shadow:
    0 16px 50px rgba(0,0,0,.7);
}


/* =========================================================
   EDIT MODE BUTTON
========================================================= */

.edit-button{
  position:absolute;

  left:14px;

  bottom:
    calc(
      28px +
      env(safe-area-inset-bottom)
    );

  z-index:1200;

  padding:11px 15px;

  border:1px solid rgba(255,255,255,.7);
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #777,
      #111
    );

  color:#fff;

  font-size:10px;
  font-weight:900;

  letter-spacing:.12em;

  box-shadow:
    0 8px 25px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.55);
}

.edit-button.active{
  color:#050505;

  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa
    );
}


/* =========================================================
   EDIT PANEL
========================================================= */

.edit-panel{
  position:absolute;

  left:12px;
  right:12px;

  bottom:
    calc(
      82px +
      env(safe-area-inset-bottom)
    );

  z-index:1300;

  display:none;

  padding:14px;

  border:1px solid rgba(255,255,255,.6);
  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(125,125,125,.97),
      rgba(25,25,25,.98) 40%,
      rgba(5,5,5,.98)
    );

  backdrop-filter:blur(20px);

  box-shadow:
    0 15px 45px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.6);
}

.edit-panel.show{
  display:block;
}

.edit-title{
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
}

.edit-text{
  margin-top:7px;

  color:#ccc;

  font-size:10px;
  line-height:1.5;
}

.edit-selected{
  margin-top:10px;

  padding:9px 10px;

  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;

  background:rgba(0,0,0,.3);

  font-size:10px;
  line-height:1.5;
}

.edit-help{
  margin-top:8px;

  color:#aaa;

  font-size:9px;
  line-height:1.5;
}

.copy-button{
  width:100%;

  margin-top:10px;
  padding:11px;

  border:1px solid #fff;
  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #aaa
    );

  color:#080808;

  font-size:10px;
  font-weight:900;
}


/* =========================================================
   DETAIL
========================================================= */

.sheet-backdrop{
  position:fixed;
  inset:0;

  z-index:1998;

  background:rgba(0,0,0,.25);

  opacity:0;

  pointer-events:none;

  transition:.2s;
}

.sheet-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.bottom-sheet{
  position:fixed;

  left:10px;
  right:10px;

  bottom:
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  z-index:2000;

  padding:11px 18px 19px;

  border:1px solid rgba(255,255,255,.58);
  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      rgba(120,120,120,.97),
      rgba(32,32,32,.98) 32%,
      rgba(6,6,6,.99) 67%,
      rgba(70,70,70,.98)
    );

  backdrop-filter:blur(24px);

  box-shadow:
    0 -12px 55px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.7);

  transform:
    translateY(
      calc(100% + 60px)
    );

  transition:
    transform
    .34s
    cubic-bezier(.22,.75,.25,1);
}

.bottom-sheet.show{
  transform:translateY(0);
}

.sheet-handle{
  width:43px;
  height:4px;

  margin:0 auto 17px;

  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      #777,
      #fff,
      #777
    );
}

.sheet-category{
  margin-bottom:5px;

  color:#bbb;

  font-size:9px;
  font-weight:900;

  letter-spacing:.18em;
}

.sheet-title{
  font-size:23px;
  font-weight:900;
}

.sheet-line{
  height:1px;

  margin:14px 0;

  background:
    linear-gradient(
      90deg,
      #fff,
      #999 35%,
      transparent
    );
}

.sheet-description{
  color:#ddd;

  font-size:13px;

  line-height:1.65;
}

.sheet-close{
  width:100%;

  margin-top:16px;
  padding:11px;

  border:1px solid rgba(255,255,255,.45);
  border-radius:10px;

  background:rgba(255,255,255,.10);

  color:#fff;

  font-size:10px;
  font-weight:900;

  letter-spacing:.15em;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;

  bottom:
    calc(
      100px +
      env(safe-area-inset-bottom)
    );

  z-index:3000;

  padding:10px 15px;

  border:1px solid rgba(255,255,255,.48);
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #777,
      #111
    );

  color:#fff;

  font-size:10px;

  white-space:nowrap;

  opacity:0;

  transform:
    translate(-50%,15px);

  pointer-events:none;

  transition:.2s;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:800px){

  .header{
    width:390px;
    right:auto;
  }

  .filters-wrap{
    width:850px;
  }

  .bottom-sheet{
    width:390px;

    left:20px;
    right:auto;

    bottom:20px;
  }

  .edit-panel{
    width:390px;
    right:auto;
  }

}
</style>
</head>

<body>

<div id="app">

  <div id="map"></div>


  <!-- OFFICIAL MAP -->

  <div id="officialMap">

    <div class="official-scroll">

      <img
        src="./Map.JPG"
        alt="BMSG FES 2026 会場マップ"
      >

    </div>

  </div>


  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="brand-main">
        BMSG FES 2026
      </div>

      <div class="brand-sub">
        VENUE NAVIGATOR
      </div>

    </div>


    <div class="mode-switch">

      <button
        class="mode-button active"
        data-mode="real"
      >
        REAL MAP
      </button>

      <button
        class="mode-button"
        data-mode="official"
      >
        OFFICIAL MAP
      </button>

    </div>

  </header>


  <!-- FILTER -->

  <div class="filters-wrap">

    <div class="filters">

      <button class="filter active" data-filter="all">
        ALL
      </button>

      <button class="filter" data-filter="stage">
        STAGE
      </button>

      <button class="filter" data-filter="gate">
        GATE
      </button>

      <button class="filter" data-filter="food">
        FOOD
      </button>

      <button class="filter" data-filter="goods">
        GOODS
      </button>

      <button class="filter" data-filter="wc">
        WC
      </button>

      <button class="filter" data-filter="photo">
        PHOTO
      </button>

      <button class="filter" data-filter="info">
        INFO
      </button>

      <button class="filter" data-filter="booth">
        BOOTH
      </button>

    </div>

  </div>


  <!-- EDIT -->

  <button
    class="edit-button"
    id="editButton"
  >
    EDIT MODE
  </button>


  <div
    class="edit-panel"
    id="editPanel"
  >

    <div class="edit-title">
      📍 PIN POSITION EDITOR
    </div>

    <div class="edit-text">
      全ピンをドラッグできます。
    </div>

    <div
      class="edit-selected"
      id="editSelected"
    >
      ピンを選択してください
    </div>

    <div class="edit-help">
      PC：ピンをドラッグ<br>
      スマホ：ピンをタップ → 地図上の移動先をタップでもOK
    </div>

    <button
      class="copy-button"
      id="copyButton"
    >
      配置データをコピー
    </button>

  </div>


  <!-- LOCATION -->

  <button
    class="location-button"
    id="locationButton"
    aria-label="現在地"
  >
    <span class="location-symbol"></span>
  </button>

</div>


<!-- DETAIL -->

<div
  class="sheet-backdrop"
  id="sheetBackdrop"
></div>


<div
  class="bottom-sheet"
  id="bottomSheet"
>

  <div class="sheet-handle"></div>

  <div
    class="sheet-category"
    id="sheetCategory"
  ></div>

  <div
    class="sheet-title"
    id="sheetTitle"
  ></div>

  <div class="sheet-line"></div>

  <div
    class="sheet-description"
    id="sheetDescription"
  ></div>

  <button
    class="sheet-close"
    id="sheetClose"
  >
    CLOSE
  </button>

</div>


<div
  class="toast"
  id="toast"
></div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map(
  "map",
  {
    zoomControl:false,
    attributionControl:true
  }
).setView(
  [
    35.6249,
    139.7758
  ],
  16
);


L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:20,

    attribution:
      "&copy; OpenStreetMap contributors"

  }

).addTo(map);


/* =========================================================
   ICON SVG
========================================================= */

const icons = {


stage: `
<svg viewBox="0 0 24 24">
  <rect x="9" y="3" width="6" height="11" rx="3"></rect>
  <path d="M6 11a6 6 0 0 0 12 0"></path>
  <path d="M12 17v4"></path>
  <path d="M9 21h6"></path>
</svg>
`,


gate: `
<svg viewBox="0 0 24 24">
  <path d="M4 21V5h16v16"></path>
  <path d="M8 21V9h8v12"></path>
  <path d="M3 5h18"></path>
</svg>

/* =========================================================
   CREATE ICON
========================================================= */

function createVenueIcon(v){

  const stage =
    v.category === "stage";

  const width =
    140;

  const height =
    stage ? 86 : 72;

  const pinHeight =
    stage ? 58 : 46;


  return L.divIcon({

    className:
      "venue-leaflet-icon",

    html: `
      <div
        class="
          venue-marker
          marker-${v.category}
          ${stage ? "stage-marker" : ""}
        "
        data-id="${v.id}"
      >

        <div class="marker-hit">

          <div class="marker-pin">

            <div class="marker-inner">
              ${icons[v.category]}
            </div>

          </div>

        </div>

        <div class="marker-label">
          ${v.label}
        </div>

      </div>
    `,

    iconSize:
      [
        width,
        height
      ],

    /*
      ★ ピン先端が緯度経度になる
    */

    iconAnchor:
      [
        width / 2,
        pinHeight
      ]

  });

}


/* =========================================================
   CREATE MARKERS
========================================================= */

const venueMarkers = [];

let editMode = false;

let selectedItem = null;


venues.forEach(v => {

  const marker =
    L.marker(

      [
        v.lat,
        v.lng
      ],

      {

        icon:
          createVenueIcon(v),

        draggable:
          false,

        autoPan:
          true,

        riseOnHover:
          true

      }

    ).addTo(map);


  const item = {
    venue:v,
    marker:marker
  };


  venueMarkers.push(item);


  /*
    CLICK
  */

  marker.on(
    "click",
    event => {

      L.DomEvent.stopPropagation(
        event
      );


      if(editMode){

        selectMarker(
          item
        );

      }

      else{

        openVenue(
          v
        );

      }

    }
  );


  /*
    DRAG START
  */

  marker.on(
    "dragstart",
    () => {

      if(!editMode){
        return;
      }

      selectMarker(
        item
      );

      map.dragging.disable();

    }
  );


  /*
    DRAG
  */

  marker.on(
    "drag",
    () => {

      if(!editMode){
        return;
      }

      updateVenuePosition(
        item
      );

    }
  );


  /*
    DRAG END
  */

  marker.on(
    "dragend",
    () => {

      if(!editMode){
        return;
      }

      updateVenuePosition(
        item
      );

      map.dragging.enable();

      showToast(
        `${v.name} を移動しました`
      );

    }
  );

});


/* =========================================================
   SELECT MARKER
========================================================= */

function selectMarker(item){

  selectedItem =
    item;


  document
    .querySelectorAll(
      ".venue-marker"
    )
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

    });


  const markerElement =
    item.marker.getElement();


  if(markerElement){

    const visual =
      markerElement.querySelector(
        ".venue-marker"
      );


    if(visual){

      visual.classList.add(
        "selected"
      );

    }

  }


  updateVenuePosition(
    item
  );

}


/* =========================================================
   UPDATE POSITION
========================================================= */

function updateVenuePosition(item){

  const position =
    item.marker.getLatLng();


  item.venue.lat =
    position.lat;


  item.venue.lng =
    position.lng;


  document.getElementById(
    "editSelected"
  ).innerHTML = `

    <strong>
      ${item.venue.name}
    </strong>

    <br>

    LAT：
    ${position.lat.toFixed(7)}

    <br>

    LNG：
    ${position.lng.toFixed(7)}

  `;

}

      "active",

    );

      editMode

        : "EDIT MODE";

      item => {

        if(editMode){

          item.marker.dragging.enable();

        }

        else{

          item.marker.dragging.disable();

        }

      }
    );


    if(!editMode){

      selectedItem =
        null;


      document
        .querySelectorAll(
          ".venue-marker"
        )

          el.classList.remove(
            "selected"
          );

    );

);


/* =========================================================
   MAP TAP TO MOVE SELECTED PIN

   スマホ用。
========================================================= */

map.on(
  "click",
  event => {

    if(
      !editMode ||
      !selectedItem
    ){
      return;
    }


    selectedItem.marker.setLatLng(
      event.latlng
    );


    updateVenuePosition(
      selectedItem
    );


    showToast(
      `${selectedItem.venue.name} を移動しました`
    );

  }
);


/* =========================================================
   COPY
========================================================= */

document.getElementById(
  "copyButton"
).addEventListener(
  "click",
  async () => {

    const output =
      venueMarkers.map(
        item => {

          const p =
            item.marker.getLatLng();


          return {

            id:
              item.venue.id,

            name:
              item.venue.name,

            lat:
              Number(
                p.lat.toFixed(7)
              ),

            lng:
              Number(
                p.lng.toFixed(7)
              )

          };

        }
      );


    const text =
      JSON.stringify(
        output,
        null,
        2
      );


    try{

      await navigator.clipboard.writeText(
        text
      );


      showToast(
        "配置データをコピーしました"
      );

    }

    catch(error){

      /*
        clipboard APIが使えない場合
      */

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        text;


      textarea.style.position =
        "fixed";


      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.focus();
      textarea.select();


      try{

        document.execCommand(
          "copy"
        );


        showToast(
          "配置データをコピーしました"
        );

      }

      catch(error2){

        window.prompt(
          "この配置データをコピーしてください",
          text
        );

      }


      textarea.remove();

    }

  }
);


/* =========================================================
   FILTER
========================================================= */

const filterButtons =
  document.querySelectorAll(
    ".filter"
  );


filterButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        filterButtons.forEach(
          b => {

            b.classList.remove(
              "active"
            );

          }
        );


        button.classList.add(
          "active"
        );


        const category =
          button.dataset.filter;


        venueMarkers.forEach(
          item => {

            const visible =
              category === "all"
              ||
              item.venue.category ===
              category;


            if(visible){

              if(
                !map.hasLayer(
                  item.marker
                )
              ){

                item.marker.addTo(
                  map
                );

              }

            }

            else{

              if(
                map.hasLayer(
                  item.marker
                )
              ){

                map.removeLayer(
                  item.marker
                );

              }

            }

          }
        );

      }
    );

  }
);

/* =========================================================
   GPS

   現在地はサーバーへ送信しない。
   localStorageにも保存しない。
========================================================= */

let locationMarker =
  null;

let accuracyCircle =
  null;

let watchId =
  null;

let firstLocation =
  true;


const userIcon =
  L.divIcon({

    className:"",

    html:
      '<div class="user-location"></div>',

    iconSize:
      [22,22],

    iconAnchor:
      [11,11]

  });


locationButton.addEventListener(
  "click",
  () => {

    if(locationMarker){

      map.flyTo(

        locationMarker.getLatLng(),

        18,

        {
          duration:.8
        }

      );

      return;

    }


    if(!navigator.geolocation){

      showToast(
        "位置情報を利用できません"
      );

      return;

    }


    showToast(
      "現在地を取得しています…"
    );


    watchId =
      navigator.geolocation.watchPosition(

        locationSuccess,

        locationError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            2000,

          timeout:
            15000

        }

      );

  }
);


function locationSuccess(
  position
){

  const lat =
    position.coords.latitude;

  const lng =
    position.coords.longitude;

  const accuracy =
    position.coords.accuracy;


  if(!locationMarker){

    locationMarker =
      L.marker(

        [
          lat,
          lng
        ],

        {

          icon:
            userIcon,

          zIndexOffset:
            10000

        }

      ).addTo(map);

  }

  else{

    locationMarker.setLatLng(
      [
        lat,
        lng
      ]
    );

  }


  if(!accuracyCircle){

    accuracyCircle =
      L.circle(

        [
          lat,
          lng
        ],

        {

          radius:
            accuracy,

          color:
            "#1976ff",

          weight:
            1,

          opacity:
            .5,

          fillColor:
            "#1976ff",

          fillOpacity:
            .08

        }

      ).addTo(map);

  }

  else{

    accuracyCircle.setLatLng(
      [
        lat,
        lng
      ]
    );


    accuracyCircle.setRadius(
      accuracy
    );

  }


  if(firstLocation){

    firstLocation =
      false;


    map.flyTo(

      [
        lat,
        lng
      ],

      18,

      {
        duration:1
      }

    );


    showToast(
      "現在地を表示しました"
    );

  }

}


/* =========================================================
   GPS ERROR
========================================================= */

function locationError(
  error
){

  let message =
    "現在地を取得できませんでした";


  if(error.code === 1){

    message =
      "位置情報が許可されていません";

  }


  if(error.code === 2){

    message =
      "現在地を確認できませんでした";

  }


  if(error.code === 3){

    message =
      "現在地取得がタイムアウトしました";

  }


  showToast(
    message
  );

}


/* =========================================================
   TOAST
========================================================= */

const toast =
  document.getElementById(
    "toast"
  );

let toastTimer;


function showToast(
  message
){

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },

      2300
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "pagehide",
  () => {

    if(
      watchId !== null
    ){

      navigator.geolocation.clearWatch(
        watchId
      );

    }

  }
);
